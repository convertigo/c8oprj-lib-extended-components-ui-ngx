            --tw-font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system,
                "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans",
                "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
          
            --tw-text-xs: 0.75rem;
            --tw-text-sm: 0.875rem;
            --tw-text-base: 1rem;
            --tw-text-lg: 1.125rem;
          
            --tw-leading-tight: 1.25;
            --tw-leading-normal: 1.5;
          
            /* Radii */
            --tw-radius-sm: 0.5rem;   /* ~rounded-lg */
            --tw-radius-md: 0.75rem;  /* ~rounded-xl */
            --tw-radius-lg: 1rem;     /* ~rounded-2xl */
          
            /* Shadows */
            --tw-shadow-sm: 0 1px 2px rgba(0,0,0,.06);
            --tw-shadow-md: 0 6px 18px rgba(0,0,0,.10);
            --tw-shadow-lg: 0 12px 30px rgba(0,0,0,.14);
          
            /* Spacing (used as generic paddings) */
            --tw-pad-x: 1rem;   /* px-4 */
            --tw-pad-y: 0.75rem;/* py-3 */
          
            /* Color tokens mapped to Ionic color palette */
            --tw-bg: var(--ion-background-color, #ffffff);
            --tw-surface: var(--ion-card-background, var(--ion-item-background, #ffffff));
            --tw-surface-2: color-mix(in srgb, var(--tw-surface) 88%, var(--ion-background-color, #ffffff));
            --tw-border: var(--ion-border-color, #d7d8da);
            --tw-text: var(--ion-text-color, #0f172a);
            --tw-text-muted: var(--ion-color-medium, #6b7280);
          
            --tw-primary: var(--ion-color-primary, #3880ff);
            --tw-primary-contrast: var(--ion-color-primary-contrast, #ffffff);
            --tw-success: var(--ion-color-success, #2dd36f);
            --tw-warning: var(--ion-color-warning, #ffc409);
            --tw-danger: var(--ion-color-danger, #eb445a);
          
            /* Focus ring */
            --tw-ring: 0 0 0 3px rgba(var(--ion-color-primary-rgb, 56, 128, 255), .25);
          }
          
          /* Manual light mode from toolbar toggle */
          :root.force-light {
            --tw-shadow-sm: 0 1px 2px rgba(0,0,0,.06);
            --tw-shadow-md: 0 6px 18px rgba(0,0,0,.10);
            --tw-shadow-lg: 0 12px 30px rgba(0,0,0,.14);
          
            --tw-ring: 0 0 0 3px rgba(var(--ion-color-primary-rgb, 56, 128, 255), .25);
            color-scheme: light;
          }
          
          :root.force-dark {
            --tw-shadow-sm: 0 1px 2px rgba(0,0,0,.35);
            --tw-shadow-md: 0 8px 20px rgba(0,0,0,.45);
            --tw-shadow-lg: 0 16px 40px rgba(0,0,0,.55);
          
            --tw-ring: 0 0 0 3px rgba(var(--ion-color-primary-rgb, 66,140,255), .28);
            color-scheme: dark;
          }
          
          /* -------------------------------------------------------
             2) Map non-color tokens to Ionic CSS variables
          -------------------------------------------------------- */
          :root {
            --ion-font-family: var(--tw-font-sans);
            --ion-border-radius: var(--tw-radius-md);
          }
          
          /* -------------------------------------------------------
             3) Global base polish
          -------------------------------------------------------- */
          html, body {
            font-family: var(--tw-font-sans);
            color: var(--tw-text);
            background: var(--tw-bg);
          }
          
          ion-app, ion-content {
            --background: var(--tw-bg);
          }
          
          /* Make default text feel like Tailwind */
          ion-text, ion-label, p, span, div {
            letter-spacing: -0.01em;
            line-height: var(--tw-leading-normal);
          }
          
          /* -------------------------------------------------------
             4) Buttons (ion-button)
          -------------------------------------------------------- */
          ion-button {
            --border-radius: var(--tw-radius-sm);
            --box-shadow: var(--tw-shadow-sm);
            text-transform: none;
            font-weight: 600;
            letter-spacing: -0.01em;
          }
          
          ion-button::part(native) {
            padding: 0.65rem 1rem; /* tailwind-ish */
          }
          
          /* Outline buttons look cleaner */
          ion-button[fill="outline"] {
            --border-width: 1px;
            --border-color: var(--tw-border);
            --color: var(--tw-text);
            --background: transparent;
            --box-shadow: none;
          }
          
          /* Clear buttons */
          ion-button[fill="clear"] {
            --color: var(--tw-text);
            --background: transparent;
            --box-shadow: none;
          }
          
          /* -------------------------------------------------------
             5) Inputs (ion-input / ion-textarea / ion-select)
          -------------------------------------------------------- */
          ion-item {
            --inner-padding-end: 0px;
            --inner-padding-start: 0px;
            --padding-start: 0px;
            --padding-end: 0px;
            --min-height: auto;
            --background: transparent;
            --inner-border-width: 0;
            --border-width: 0;
            --inner-box-shadow: none;
          }
          
          /* Wrap inputs in a "field" look */
          ion-input, ion-textarea, ion-select, ion-datetime {
            --padding-start: 0px;
          }
          
          /* Use ion-item as container: add a Tailwind-like field style */
          ion-item {
            border: 1px solid var(--tw-border);
            border-radius: var(--tw-radius-sm);
            padding: 0.25rem 0.75rem;
            background: var(--tw-surface);
            box-shadow: var(--tw-shadow-sm);
            margin: 0.5rem 0;
          }
          
          /* Labels */
          ion-item ion-label {
            font-size: var(--tw-text-sm);
            color: var(--tw-text-muted);
            margin-bottom: 0.25rem;
          }
          
          /* Actual input text */
          ion-input, ion-textarea, ion-select {
            font-size: var(--tw-text-base);
            color: var(--tw-text);
          }
          
          /* Signature component defaults */
          c8o-signature,
          ion-item c8o-signature {
            display: block;
            width: 100%;
            max-width: 100%;
            flex: 1 1 auto;
          }
          
          c8o-signature .signature-pad {
            --tw-signature-shell: color-mix(in srgb, var(--tw-surface-2) 80%, var(--tw-surface) 20%);
            --tw-signature-board: color-mix(in srgb, var(--tw-surface) 88%, var(--tw-bg) 12%);
            --tw-signature-border: color-mix(in srgb, var(--tw-border) 86%, transparent);
            width: 100% !important;
            max-width: none !important;
            height: auto !important;
            max-height: none !important;
            box-sizing: border-box;
            margin-top: 0.75rem;
            padding: 0.5rem;
            border: 1px solid var(--tw-signature-border) !important;
            border-radius: var(--tw-radius-md);
            background: var(--tw-signature-shell) !important;
            box-shadow: var(--tw-shadow-sm) !important;
          }
          
          c8o-signature .signature-pad--body {
            width: 100%;
            min-height: 220px;
            border-radius: var(--tw-radius-md);
            overflow: hidden;
            background: var(--tw-signature-board) !important;
            border: 1px solid var(--tw-signature-border) !important;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tw-signature-border) 78%, var(--tw-text) 22%);
          }
          
          c8o-signature canvas {
            display: block;
            width: auto !important;
            height: 220px !important;
            max-width: none;
            background: transparent;
          }
          
          :root.force-dark c8o-signature canvas {
            filter: invert(1) hue-rotate(180deg);
          }
          
          :root.force-light c8o-signature canvas {
            filter: none;
          }
          
          c8o-signature .signature-pad--icon-bar {
            width: 100%;
            overflow: hidden !important;
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            padding: 0.15rem;
            border-radius: var(--tw-radius-sm);
            background: var(--tw-signature-shell) !important;
          }
          
          c8o-signature .signature-pad--icon-bar ion-button {
            flex: 1 1 0;
            min-width: 0;
            margin: 0;
            --box-shadow: none;
            --border-radius: var(--tw-radius-sm);
            --background: color-mix(in srgb, var(--tw-surface-2) 82%, var(--tw-border) 18%);
            --color: var(--tw-text);
          }
          
          c8o-signature .signature-pad--icon-bar ion-button::part(native) {
            padding: 0.45rem 0.35rem;
          }
          
          :root.force-light c8o-signature .signature-pad--icon-bar ion-button {
            --background: color-mix(in srgb, var(--tw-surface-2) 66%, #cbd5e1 34%);
          }
          
          @media (prefers-color-scheme: light) {
            :root:not(.force-dark) c8o-signature .signature-pad--icon-bar ion-button {
              --background: color-mix(in srgb, var(--tw-surface-2) 66%, #cbd5e1 34%);
            }
          }
          
          :root.force-dark c8o-signature .signature-pad {
            --tw-signature-shell: color-mix(in srgb, var(--tw-surface) 72%, #020617 28%);
            --tw-signature-board: color-mix(in srgb, var(--tw-surface) 66%, #020617 34%);
            --tw-signature-border: color-mix(in srgb, #334155 66%, transparent);
          }
          
          @media (prefers-color-scheme: dark) {
            :root:not(.force-light) c8o-signature .signature-pad {
              --tw-signature-shell: color-mix(in srgb, var(--tw-surface) 72%, #020617 28%);
              --tw-signature-board: color-mix(in srgb, var(--tw-surface) 66%, #020617 34%);
              --tw-signature-border: color-mix(in srgb, #334155 66%, transparent);
            }
          }
          
          /* Focus ring */
          ion-item.item-has-focus {
            box-shadow: var(--tw-shadow-sm), var(--tw-ring);
            border-color: color-mix(in srgb, var(--tw-primary) 45%, var(--tw-border));
          }
          
          /* Placeholder muted */
          ion-input::part(native)::placeholder,
          ion-textarea::part(native)::placeholder {
            color: color-mix(in srgb, var(--tw-text-muted) 65%, transparent);
          }
          
          /* Helper / error text (if you use ion-note under items) */
          ion-note {
            font-size: var(--tw-text-sm);
            color: var(--tw-text-muted);
          }
          
          /* -------------------------------------------------------
             6) Cards (ion-card)
          -------------------------------------------------------- */
          ion-card {
            border-radius: var(--tw-radius-lg);
            box-shadow: var(--tw-shadow-md);
            border: 1px solid var(--tw-border);
            overflow: hidden;
            margin-inline-start: 0;
            margin-inline-end: 0;
          }
          
          ion-card-header {
            padding: 1rem 1rem 0.25rem 1rem;
            --color: var(--tw-text);
            color: var(--tw-text);
          }
          
          ion-card-header,
          ion-card-header * {
            color: var(--tw-text);
          }
          
          ion-card-title {
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--tw-text);
          }
          
          ion-card-subtitle {
            color: var(--tw-text-muted);
          }
          
          ion-card-content {
            padding: 1rem;
            color: var(--tw-text);
          }
          
          /* -------------------------------------------------------
             7) Lists (ion-list / ion-item)
          -------------------------------------------------------- */
          ion-list {
            --background: transparent;
            background: transparent;
            padding: 0;
          }
          
          ion-menu ion-list {
            --background: transparent;
            background: transparent;
          }
          
          ion-list ion-item,
          ion-list ion-item.item-interactive,
          ion-list ion-item.item-has-focus,
          ion-list ion-item.item-has-value,
          ion-list ion-item.item-label-floating,
          ion-list ion-item.item-label-stacked,
          ion-list ion-item.item-label-fixed,
          ion-list ion-item.item-label-default {
            border: 0;
            border-radius: 0;
            margin: 0;
            padding: 0;
            --background: transparent !important;
            background: transparent !important;
            box-shadow: none !important;
          }
          
          ion-list ion-item::part(native) {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid color-mix(in srgb, var(--tw-border) 82%, transparent);
            background: transparent !important;
          }
          ion-list ion-item:last-child::part(native) {
            border-bottom: 0;
          }
          
          ion-list ion-item ion-label h3 {
            margin: 0 0 0.12rem;
            color: var(--tw-text);
            font-size: 0.95rem;
            font-weight: 650;
            letter-spacing: -0.01em;
          }
          
          ion-list ion-item ion-label p {
            margin: 0.1rem 0 0;
            color: color-mix(in srgb, var(--tw-text) 74%, var(--tw-text-muted) 26%) !important;
            font-size: 0.86rem;
            line-height: 1.28rem;
            font-weight: 500;
          }
          
          ion-list ion-item ion-label span {
            color: inherit !important;
          }
          
          @media (prefers-color-scheme: dark) {
            :root:not(.force-light) ion-list ion-item ion-label {
              color: #f8fafc;
            }
            
            :root:not(.force-light) ion-list ion-item ion-label h1,
            :root:not(.force-light) ion-list ion-item ion-label h2,
            :root:not(.force-light) ion-list ion-item ion-label h3,
            :root:not(.force-light) ion-list ion-item ion-label h4,
            :root:not(.force-light) ion-list ion-item ion-label h5,
            :root:not(.force-light) ion-list ion-item ion-label h6,
            :root:not(.force-light) ion-list ion-item ion-label span,
            :root:not(.force-light) ion-list ion-item ion-label strong,
            :root:not(.force-light) ion-list ion-item ion-label b {
              color: #f8fafc !important;
            }
            
            :root:not(.force-light) ion-list ion-item ion-label p,
            :root:not(.force-light) ion-list ion-item ion-label p span,
            :root:not(.force-light) ion-list ion-item ion-label p strong,
            :root:not(.force-light) ion-list ion-item ion-label p b,
            :root:not(.force-light) ion-list ion-item ion-label small {
              color: #cbd5e1 !important;
            }
          }
          
          :root.force-dark ion-list ion-item ion-label {
            color: #f8fafc;
          }
          
          :root.force-dark ion-list ion-item ion-label h1,
          :root.force-dark ion-list ion-item ion-label h2,
          :root.force-dark ion-list ion-item ion-label h3,
          :root.force-dark ion-list ion-item ion-label h4,
          :root.force-dark ion-list ion-item ion-label h5,
          :root.force-dark ion-list ion-item ion-label h6,
          :root.force-dark ion-list ion-item ion-label span,
          :root.force-dark ion-list ion-item ion-label strong,
          :root.force-dark ion-list ion-item ion-label b {
            color: #f8fafc !important;
          }
          
          :root.force-dark ion-list ion-item ion-label p,
          :root.force-dark ion-list ion-item ion-label p span,
          :root.force-dark ion-list ion-item ion-label p strong,
          :root.force-dark ion-list ion-item ion-label p b,
          :root.force-dark ion-list ion-item ion-label small {
            color: #cbd5e1 !important;
          }
          
          /* Item dividers off by default */
          ion-item-divider {
            --background: transparent;
            --color: var(--tw-text-muted);
            font-weight: 600;
          }
          
          /* -------------------------------------------------------
             8) Toolbar / Header
          -------------------------------------------------------- */
          ion-header, ion-toolbar {
            --background: var(--tw-surface);
            --border-color: var(--tw-border);
            border-bottom: 1px solid var(--tw-border);
          }
          
          ion-toolbar {
            --border-width: 0;
            border-bottom: 0;
          }
          
          ion-title {
            font-weight: 700;
            letter-spacing: -0.02em;
          }
          
          ion-toolbar ion-button.toolbar-theme-button {
            --padding-start: 0.35rem;
            --padding-end: 0.35rem;
            --padding-top: 0.2rem;
            --padding-bottom: 0.2rem;
            --background: color-mix(in srgb, var(--tw-surface) 82%, var(--tw-primary) 18%);
            --background-activated: color-mix(in srgb, var(--tw-surface) 70%, var(--tw-primary) 30%);
            --background-hover: color-mix(in srgb, var(--tw-surface) 76%, var(--tw-primary) 24%);
            --border-radius: 999px;
            --box-shadow: none;
            min-height: 2rem;
            margin-inline-start: 0.35rem;
          }
          
          ion-toolbar ion-button.toolbar-theme-button ion-icon {
            font-size: 1.08rem;
            color: var(--tw-text);
          }
          
          ion-toolbar ion-select.toolbar-lang-select {
            --padding-start: 0.5rem;
            --padding-end: 0.45rem;
            --placeholder-color: var(--tw-text);
            --border-width: 1px;
            --border-color: var(--tw-border);
            --border-radius: 999px;
            --highlight-color-focused: transparent;
            --highlight-color-valid: transparent;
            --highlight-color-invalid: transparent;
            --background: color-mix(in srgb, var(--tw-surface) 88%, var(--tw-border) 12%);
            min-height: 2rem;
            margin-inline-start: 0.35rem;
            margin-inline-end: 0.35rem;
            border: 1px solid var(--tw-border);
            border-radius: 999px;
            box-shadow: none;
            color: var(--tw-text);
          }
          
          ion-toolbar ion-select.toolbar-lang-select::part(text) {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--tw-text);
          }
          
          ion-toolbar ion-select.toolbar-lang-select::part(icon) {
            color: var(--tw-text);
            opacity: 0.85;
          }
          
          ion-popover::part(content) {
            border-radius: var(--tw-radius-md);
            border: 1px solid var(--tw-border);
            box-shadow: var(--tw-shadow-lg);
            background: var(--tw-surface);
            color: var(--tw-text);
          }
          
          ion-popover ion-item {
            --background: transparent;
            --color: var(--tw-text);
            border: 0;
            box-shadow: none;
            margin: 0;
          }
          
          /* -------------------------------------------------------
             9) Tabs
          -------------------------------------------------------- */
          ion-tab-bar {
            border-top: 1px solid var(--tw-border);
          }
          
          ion-tab-button {
            --color: var(--tw-text-muted);
            --color-selected: var(--tw-primary);
          }
          
          /* -------------------------------------------------------
             10) Modals / Alerts / Toasts
          -------------------------------------------------------- */
          ion-modal::part(content) {
            border-radius: var(--tw-radius-lg);
            box-shadow: var(--tw-shadow-lg);
            border: 1px solid var(--tw-border);
            overflow: hidden;
            background: var(--tw-surface);
          }
          
          ion-action-sheet {
            --background: var(--tw-surface);
            --color: var(--tw-text);
            --button-color: var(--tw-text);
            --button-background: color-mix(in srgb, var(--tw-surface) 88%, var(--tw-bg) 12%);
            --button-background-activated: color-mix(in srgb, var(--tw-primary) 28%, var(--tw-surface) 72%);
            --button-background-selected: color-mix(in srgb, var(--tw-primary) 34%, var(--tw-surface) 66%);
            --backdrop-opacity: 0.62;
            --max-width: min(34rem, calc(100vw - 1.2rem));
          }
          
          ion-action-sheet ion-backdrop {
            background: color-mix(in srgb, #020617 64%, transparent);
          }
          
          ion-action-sheet .action-sheet-wrapper {
            padding: 0.4rem;
          }
          
          ion-action-sheet .action-sheet-group {
            background: var(--tw-surface);
            border: 1px solid color-mix(in srgb, var(--tw-border) 84%, var(--tw-text) 16%);
            border-radius: var(--tw-radius-lg);
            box-shadow: var(--tw-shadow-lg);
            overflow: hidden;
          }
          
          ion-action-sheet .action-sheet-group + .action-sheet-group {
            margin-top: 0.45rem;
          }
          
          ion-action-sheet .action-sheet-title {
            color: color-mix(in srgb, var(--tw-text) 72%, var(--tw-text-muted) 28%);
            font-weight: 700;
            letter-spacing: -0.01em;
            background: color-mix(in srgb, var(--tw-surface-2) 74%, var(--tw-surface) 26%);
            border-bottom: 1px solid color-mix(in srgb, var(--tw-border) 82%, var(--tw-text) 18%);
          }
          
          ion-action-sheet .action-sheet-title,
          ion-action-sheet .action-sheet-title * {
            color: color-mix(in srgb, var(--tw-text) 72%, var(--tw-text-muted) 28%) !important;
            opacity: 1 !important;
          }
          
          ion-action-sheet .action-sheet-sub-title {
            color: color-mix(in srgb, var(--tw-text) 82%, transparent);
          }
          
          ion-action-sheet .action-sheet-button {
            color: var(--tw-text);
            background: var(--button-background);
            min-height: 2.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            border-bottom: 1px solid color-mix(in srgb, var(--tw-border) 76%, var(--tw-text) 24%);
          }
          
          ion-action-sheet .action-sheet-button:not(.action-sheet-cancel):not(.action-sheet-destructive) {
            color: color-mix(in srgb, var(--tw-text) 94%, #000 6%) !important;
          }
          
          ion-action-sheet .action-sheet-button.ion-activated {
            background: var(--button-background-activated);
          }
          
          ion-action-sheet .action-sheet-button.action-sheet-selected {
            background: var(--button-background-selected);
          }
          
          ion-action-sheet .action-sheet-button:last-child {
            border-bottom: 0;
          }
          
          ion-action-sheet .action-sheet-button-inner {
            justify-content: flex-start;
            gap: 0.5rem;
          }
          
          ion-action-sheet .action-sheet-button.action-sheet-destructive {
            color: var(--tw-danger);
          }
          
          ion-action-sheet .action-sheet-group-cancel .action-sheet-button.action-sheet-cancel {
            color: color-mix(in srgb, var(--tw-danger) 78%, #450a0a 22%);
            font-weight: 700;
            background: color-mix(in srgb, var(--tw-danger) 18%, #ffffff 82%);
            border-top: 0;
            justify-content: center;
          }
          
          ion-action-sheet .action-sheet-icon {
            color: color-mix(in srgb, var(--tw-text) 82%, transparent);
          }
          
          @media (prefers-color-scheme: dark) {
            :root:not(.force-light) ion-action-sheet {
              --background: #0b1220;
              --color: #f1f5f9;
              --button-color: #f1f5f9;
              --button-background: #111b2e;
              --button-background-activated: #1e3a8a;
              --button-background-selected: #1d4ed8;
              --backdrop-opacity: 0.7;
            }
            
            :root:not(.force-light) ion-action-sheet .action-sheet-group {
              border-color: #334155;
            }
            
            :root:not(.force-light) ion-action-sheet .action-sheet-title {
              background: #132033;
              border-bottom-color: #334155;
            }
            
            :root:not(.force-light) ion-action-sheet .action-sheet-title,
            :root:not(.force-light) ion-action-sheet .action-sheet-title * {
              color: #cbd5e1 !important;
              opacity: 1 !important;
            }
            
            :root:not(.force-light) ion-action-sheet .action-sheet-button:not(.action-sheet-cancel):not(.action-sheet-destructive) {
              color: #f8fafc !important;
            }
            
            :root:not(.force-light) ion-action-sheet .action-sheet-sub-title,
            :root:not(.force-light) ion-action-sheet .action-sheet-icon {
              color: #cbd5e1;
            }
            
            :root:not(.force-light) ion-action-sheet .action-sheet-group-cancel .action-sheet-button.action-sheet-cancel {
              color: #fecaca;
              background: #7f1d1d;
            }
