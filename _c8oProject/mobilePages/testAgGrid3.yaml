                '		// Stands for the ONE backend call that creates the row: counts the calls, answers after 300 ms with the row and
                		// its new id, and fails when the model is "FAIL".
                		page.local["demo2:backendCalls"] = (page.local["demo2:backendCalls"] || 0) + 1;
                		const row = event.row;
                		setTimeout(() => {
                			if (row.model === "FAIL") {
                				reject(new Error("Backend refused the row"));
                			}
                			else {
                				resolve({...row, id: 100 + page.local["demo2:backendCalls"]});
                			}
                		}, 300);
                '
