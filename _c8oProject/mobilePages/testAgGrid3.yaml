      ↓CreateInBackend [ngx.components.UICustomAction-1808000000180]: 
        actionValue: 
          - xmlizable: 
            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		// Stands for the ONE backend call that creates the row: counts the calls, answers after 300 ms with the row and
                		// its new id, and fails when the model is "FAIL".
                		page.local["demo:backendCalls"] = (page.local["demo:backendCalls"] || 0) + 1;
                		const row = event.row;
                		setTimeout(() => {
                			if (row.model === "FAIL") {
                				reject(new Error("Backend refused the row"));
                			}
                			else {
                				resolve({...row, id: 100 + page.local["demo:backendCalls"]});
                			}
                		}, 300);
                '
        comment: Simulated backend. A real page calls its sequence here, once.
