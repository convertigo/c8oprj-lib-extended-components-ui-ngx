                →: |
                  '		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
                  		var makes = ["Toyota", "Ford", "Porsche", "Renault", "BMW", "Peugeot", "Tesla"];
                  		var models = ["City", "Road", "Trail", "Touring", "GT", "Sport"];
                  		var rows = [];
                  		for (var i = 0; i < 250; i++) {
                  			var make = makes[i % makes.length];
                  			var model = models[i % models.length] + " " + (i + 1);
                  			var price = 18000 + ((i * 137) % 85000);
                  			rows.push({
                  				make: make,
                  				model: model,
                  				price: price,
                  				src: (i % 4 == 0) ? "./assets/twitter_32x32.png" : "",
                  				valid: (i % 3 == 0)
                  			});
                  		}
                  		page.local["grid:rows"] = rows;
                  		page.local["grid:status"] = "Loaded " + rows.length + " rows";
                  		resolve();
                  '
    ↓SelectExpensiveButton [ngx.components.UIDynamicElement-1799400000101]: 
