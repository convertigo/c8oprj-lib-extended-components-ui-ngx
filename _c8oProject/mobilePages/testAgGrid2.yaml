                  '		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
                  		var comp = page.lib_extendedcomponents_ui_ngx_aggrid;
                  		var value = page.grid_quick_filter && page.grid_quick_filter.value ? page.grid_quick_filter.value : "";
                  		if (comp && comp.api) {
                  			if (typeof comp.api.setGridOption === "function") {
                  				comp.api.setGridOption("quickFilterText", value);
                  			} else if (typeof comp.api.setQuickFilter === "function") {
                  				comp.api.setQuickFilter(value);
                  			}
                  		}
                  		page.local["grid:status"] = "Quick filter: " + value;
                  		resolve();
                  '
