            - xmlizable: 
              - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
              - com.twinsoft.convertigo.beans.common.FormatedContent: 
                →: |
                  '		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
                  		var comp = page.lib_extendedcomponents_ui_ngx_aggrid;
                  		var threshold = 50000;
                  		var count = 0;
                  		if (comp && comp.api) {
                  			if (typeof comp.api.deselectAll === "function") {
                  				comp.api.deselectAll();
                  			}
                  			if (typeof comp.api.forEachNodeAfterFilterAndSort === "function") {
                  				comp.api.forEachNodeAfterFilterAndSort(function(node) {
                  					if (node && node.data && node.data.price >= threshold) {
                  						node.setSelected(true);
                  						count++;
                  					}
                  				});
                  			}
                  		}
                  		page.local["grid:status"] = "Selected " + count + " rows with price >= " + threshold;
                  		resolve();
                  '
