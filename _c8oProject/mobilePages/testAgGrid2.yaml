                  				comp.api.setGridOption("quickFilterText", "");
                  			} else if (typeof comp.api.setQuickFilter === "function") {
                  				comp.api.setQuickFilter("");
                  			}
                  			if (typeof comp.api.onFilterChanged === "function") {
                  				comp.api.onFilterChanged();
                  			}
                  		}
                  		page.local["grid:status"] = "Filters and sorting reset";
                  		resolve();
                  '
