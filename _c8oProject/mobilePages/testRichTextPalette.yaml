          values = JSON.stringify(&#123;"customer.name": row.name, "order.total": row.total.toFixed(2) + " EUR"&#125;);
          
          // 2. a Call Sequence step on lib_ExtendedComponents_ui_ngx.RichTextPaletteMerge
          //    html: the text saved from richTextPalette; values: the variable above (same name)
          
          // 3. its response: html, the merged HTML; variables, the keys of the text;
          //    missing, the keys without value (removeUnknown=true removes their placeholders)</pre>'
↓DemoStyle [ngx.components.UIStyle-1812200000080]: 
