comment: Page with the rich text editor with a palette of variables (richTextPalette) and its viewer (richTextPaletteViewer)
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		// #rich-text-palette: the variables of the demo, the text the editor and the viewer share, a text to sanitize
        		this.local[''rtp:variables''] = [
        			{ key: ''customer.name'', label: ''Customer name'', group: ''Customer'', icon: ''business-outline'', type: ''Text'', value: ''ACME Corporation'' },
        			{ key: ''customer.city'', label: ''Customer city'', group: ''Customer'', icon: ''location-outline'', type: ''Text'', value: ''Lyon'' },
        			{ key: ''order.number'', label: ''Order number'', group: ''Order'', icon: ''receipt-outline'', type: ''Text'', value: () => ''SO-'' + new Date().getFullYear() + ''-0042'' },
        			{ key: ''order.total'', label: ''Order total'', group: ''Order'', description: ''Taxes included'', icon: ''cash-outline'', type: ''Amount'', value: () => (1250.5).toFixed(2) + '' EUR'' },
        			{ key: ''order.notes'', label: ''Order notes'', group: ''Order'', description: ''Two lines'', icon: ''document-text-outline'', type: ''Text'', value: ''Deliver before noon\nCall <the> reception'' }
        		];
        		// the icons of the groups of the demo (the default groups keep theirs)
        		this.local[''rtp:groups''] = { ''Customer'': ''people-outline'', ''Order'': ''cart-outline'' };
        		this.local[''rtp:html''] = ''<p>Hello {{ customer.name }},</p>''
        			+ ''<p>Your order <strong>{{ order.number }}</strong> of <span style="color: #3b82f6;">{{ order.total }}</span> was registered on {{ api.clock.today }}.</p>''
        			+ ''<p>Notes: {{ order.notes }}</p>''
        			+ ''<p>Best regards,<br>{{ api.user.name }} ({{ api.user.email }})</p>''
        			+ ''<p>Unknown placeholder kept: {{ not.a.variable }}</p>'';
        		this.local[''rtp:unsafe''] = ''<p style="color: #b91c1c;">Inline style kept for {{ customer.name }}.</p>''
        			+ ''<p><img src="x" onerror="alert(1)">event handler removed, <a href="javascript:alert(2)">javascript: link removed</a>, ''
        			+ ''<a href="https://www.convertigo.com" target="_blank">link kept</a></p><script>alert(3)</script><iframe src="https://example.com"></iframe>'';
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		/*End_c8o_PageInitialization*/
        /*Begin_c8o_PageAfterViewInit*/
        		/*End_c8o_PageAfterViewInit*/
        /*Begin_c8o_PageFinalization*/
        		/*End_c8o_PageFinalization*/
        /*Begin_c8o_PageFunction*/
        	/*End_c8o_PageFunction*/
        '
