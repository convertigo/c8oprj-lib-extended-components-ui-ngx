      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.rtp-demo-code {
          	margin: 0;
          	padding: 8px;
          	border-radius: 6px;
          	background: rgba(var(--ion-text-color-rgb, 0, 0, 0), 0.06);
          	font-size: 12px;
          	white-space: pre-wrap;
          	overflow-wrap: anywhere;
          }
          .rtp-demo-event {
          	margin: 8px 0 0;
          	font-size: 12px;
          	opacity: 0.7;
          }
          .rtp-demo-sanitize lib_extendedcomponents_ui_ngx-richtextpaletteviewer {
          	margin: 12px 0;
          	padding: 12px 14px;
          	border: 1px solid rgba(var(--ion-text-color-rgb, 0, 0, 0), 0.15);
