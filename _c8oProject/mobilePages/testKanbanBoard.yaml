                  - com.twinsoft.convertigo.beans.common.FormatedContent: 
                    →: |
                      '		var columns = Array.isArray(page.local["kanban:columns"]) ? page.local["kanban:columns"] : [];
                      		var copy = [];
                      		for (var i = 0; i < columns.length; i++) {
                      			var col = columns[i] ? Object.assign({}, columns[i]) : {};
                      			var cards = Array.isArray(col.cards) ? col.cards.slice() : [];
                      			col.cards = cards;
                      			copy.push(col);
                      		}
                      		var backlogIndex = 0;
                      		for (var c = 0; c < copy.length; c++) {
                      			if (copy[c] && Array.isArray(copy[c].cards) && copy[c].cards.length > 1) {
                      				backlogIndex = c;
                      				break;
                      			}
                      		}
                      		var list = (copy[backlogIndex] && Array.isArray(copy[backlogIndex].cards)) ? copy[backlogIndex].cards : [];
                      		for (var j = list.length - 1; j > 0; j--) {
                      			var k = Math.floor(Math.random() * (j + 1));
                      			var tmp = list[j];
                      			list[j] = list[k];
                      			list[k] = tmp;
                      		}
                      		page.local["kanban:columns"] = copy;
                      		var labels = [];
                      		for (var l = 0; l < copy.length; l++) {
                      			var title = copy[l] && copy[l].title ? copy[l].title : (page.translate.instant("Kanban_Column_Label") + " " + (l + 1));
                      			var count = copy[l] && Array.isArray(copy[l].cards) ? copy[l].cards.length : 0;
                      			labels.push(title + " (" + count + ")");
                      		}
                      		page.local["kanban:summary"] = labels.join(" | ");
                      		page.local["demo:lastEvent"] = page.translate.instant("Kanban_Event_Shuffled");
                      		resolve();
                      '
