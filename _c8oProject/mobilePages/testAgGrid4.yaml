comment: Page with grids using the filter by values (valuesFilter), Excel like, on the rows of the grid and from a provider
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        /*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	// valuesFilter demo, first grid: cars with texts, numbers, days, booleans, lists and blank cells; the values come from its rows
        	public demoColumnDefs: any[] = [
        		{headerName: "Make", field: "make", filter: "agTextColumnFilter"},
        		{headerName: "Model", field: "model"},
        		{headerName: "Price", field: "price", filter: "agNumberColumnFilter"},
        		{headerName: "Released", field: "released", filter: "agDateColumnFilter", cellDataType: "dateString"},
        		{headerName: "Electric", field: "electric"},
        		{headerName: "Tags", field: "tags", filter: "agTextColumnFilter", filterValueGetter: (params: any) => params.data.tags},
        		{headerName: "Id", field: "id", filter: false}
        	];
        	public demoRows: any[] = [
        		{id: 1, make: "Toyota", model: "Celica", price: 35000, released: "1999-05-01", electric: false, tags: ["sport"]},
        		{id: 2, make: "Ford", model: "Mondeo", price: 32000, released: "2004-03-12", electric: false, tags: ["family"]},
        		{id: 3, make: "Porsche", model: "Boxter", price: 72000, released: "2012-09-30", electric: false, tags: ["sport"]},
        		{id: 4, make: "Renault", model: "Zoe", price: 29000, released: "2019-01-15", electric: true, tags: ["city", "family"]},
        		{id: 5, make: "BMW", model: "X5", price: 81000, released: "2021-06-01", electric: false, tags: ["suv"]},
        		{id: 6, make: "Toyota", model: "Yaris", price: 19000, released: "2018-02-20", electric: false, tags: ["city"]},
        		{id: 7, make: "Ford", model: "Kuga", price: 38000, released: "2020-11-05", electric: false, tags: ["suv"]},
        		{id: 8, make: "Renault", model: "Megane", price: 27000, released: "2016-04-18", electric: false, tags: ["family"]},
        		{id: 9, make: "BMW", model: "i3", price: 41000, released: "2017-07-07", electric: true, tags: ["city"]},
        		{id: 10, make: "Porsche", model: "Taycan", price: 110000, released: "2022-03-03", electric: true, tags: ["sport"]},
        		{id: 11, make: "Toyota", model: "Prius", price: 31000, released: "2015-10-10", electric: false, tags: []},
        		{id: 12, make: null, model: "Prototype", price: null, released: null, electric: null, tags: []}
        	];
        	// second grid: 10,000 distinct codes (the list of the filter draws only the rows in view)
        	public demoBigColumnDefs: any[] = [{headerName: "Code", field: "code"}, {headerName: "Number", field: "n", filter: "agNumberColumnFilter"}];
        	public demoBigRows: any[] = Array.from({length: 10000}, (value: any, index: number) => ({code: "Code " + (index + 1), n: index * 3}));
        	// third grid: a "server" table of 300 tickets; the page gives the distinct values of a column (valuesFilterProvider) and the
        	// rows kept by the filter model, as a server would; the status is an option: its id is filtered, its label is shown
        	public demoStatuses: any = {1: "Open", 2: "Closed", 3: "In progress"};
        	public demoServerTable: any[] = Array.from({length: 300}, (value: any, index: number) => ({id: index + 1, status: index % 11 == 10 ? null : [1, 2, 3][index % 3], owner: "Owner " + (index % 60)}));
        	public demoServerColumnDefs: any[] = [
        		{headerName: "Ticket", field: "id", filter: false},
        		{headerName: "Status", field: "status", filter: "agTextColumnFilter", valueFormatter: (params: any) => this.demoStatuses[params.value] || ""},
        		{headerName: "Owner", field: "owner", filter: "agTextColumnFilter"}
        	];
        	public demoServerRows: any[] = this.demoServerTable.slice(0, 10);
        	public demoValuesProvider = (column: any, search: string) => new Promise((resolve) => setTimeout(() => {
        		this.local["demo:providerCalls"] = (this.local["demo:providerCalls"] || 0) + 1;
        		const field = column.field;
        		const text = (search || "").toLowerCase();
        		const values: any[] = [];
        		for (const row of this.demoServerTable) {
        			if (values.indexOf(row[field]) < 0) {
        				values.push(row[field]);
        			}
        		}
        		const found = values.map((value: any) => field == "status" && value != null ? {value: value, label: this.demoStatuses[value]} : value)
        			.filter((value: any) => String(value?.label ?? value ?? "").toLowerCase().indexOf(text) >= 0);
        		resolve({values: found.slice(0, 25), complete: found.length <= 25});
        		this.ref?.markForCheck?.();
        	}, 200));
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	// third grid: the "server" keeps the rows whose values are kept by the filter model, the first 10 of them
        	demoServerFilter(api: any): void {
        		const model = api?.getFilterModel?.() || {};
        		this.local["demo:serverModel"] = JSON.stringify(model);
        		this.demoServerRows = this.demoServerTable.filter((row: any) => Object.keys(model).every((field: string) => !Array.isArray(model[field]?.values) || model[field].values.indexOf(row[field]) >= 0)).slice(0, 10);
        		this.ref?.markForCheck?.();
        	}
        	/*End_c8o_PageFunction*/
        
