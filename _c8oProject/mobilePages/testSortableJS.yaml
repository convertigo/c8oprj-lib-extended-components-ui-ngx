                      '		var list = Array.isArray(page.local["sortable:items"]) ? page.local["sortable:items"].slice() : [];
                      		for (var i = list.length - 1; i > 0; i--) {
                      			var j = Math.floor(Math.random() * (i + 1));
                      			var tmp = list[i];
                      			list[i] = list[j];
                      			list[j] = tmp;
                      		}
                      		var labels = [];
                      		for (var k = 0; k < list.length; k++) {
                      			var item = list[k];
                      			labels.push(item && item.label ? item.label : (page.translate.instant("SortableJS_Item_Label") + " " + (k + 1)));
                      		}
                      		page.local["sortable:items"] = list;
                      		page.local["sortable:orderText"] = labels.join(" > ");
                      		page.local["demo:lastEvent"] = page.translate.instant("SortableJS_Event_Shuffled");
                      		resolve();
                      '
