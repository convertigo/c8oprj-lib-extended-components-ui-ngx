                                  resolve({error: err});
                              }
                          })*/
                      })
                      .catch(err => {
                          delete page.global[''zxing:codeReader''];
                          if(err && !(err instanceof NotFoundException)){
                              page.c8o.log.warn(''>>> Error: '' + err);
