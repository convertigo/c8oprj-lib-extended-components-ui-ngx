        →: |
          '		try {
          			page.c8o.log.debug("[MB] " + props.actionFunction + ": " + props.actionName);
          			const agGridEvent = vars.agGridEvent;
          			if (agGridEvent == null || typeof agGridEvent.success !== "function" || typeof agGridEvent.fail !== "function") {
          				throw new Error("agGridEvent must be the event of the RowCreate Control");
          			}
          			const failed = vars.error != null && vars.error !== "" && vars.error !== false;
          			if (failed) {
          				agGridEvent.fail(vars.error);
          			}
          			else {
          				agGridEvent.success(vars.data != null && vars.data !== "" ? vars.data : undefined);
          			}
          			resolve(!failed);
          		} catch (e) {
          			reject(e);
          		}
          '
