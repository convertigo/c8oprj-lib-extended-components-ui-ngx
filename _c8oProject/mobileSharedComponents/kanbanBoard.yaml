↓Style [ngx.components.UIStyle-1802200000060]: 
  comment: Style (UIStyle).
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.kanban-host {
            display: block;
            min-height: 220px;
            overflow: auto;
          }
          
          :host ::ng-deep .kanban-board {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(260px, 1fr);
            gap: 0.9rem;
            align-items: start;
            min-height: 100%;
            padding-bottom: 4px;
          }
          
          :host ::ng-deep .kanban-column {
            border: 1px solid color-mix(in srgb, var(--tw-border, #d7d8da) 84%, transparent);
            border-radius: 12px;
            overflow: hidden;
            background: var(--tw-surface, var(--ion-card-background, #ffffff));
            box-shadow: var(--tw-shadow-sm, 0 1px 2px rgba(0,0,0,.06));
            display: flex;
            flex-direction: column;
            min-height: 120px;
          }
          
          :host ::ng-deep .kanban-column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.8rem;
            border-bottom: 1px solid color-mix(in srgb, var(--tw-border, #d7d8da) 72%, transparent);
            font-weight: 650;
            cursor: pointer;
            user-select: none;
            color: var(--tw-text, var(--ion-text-color, #0f172a));
            background: color-mix(in srgb, var(--tw-surface, #ffffff) 88%, var(--tw-bg, #f8fafc) 12%);
          }
          
          :host ::ng-deep .kanban-column-count {
            font-size: 0.76rem;
            padding: 0.12rem 0.42rem;
            border-radius: 999px;
            background: color-mix(in srgb, var(--ion-color-primary, #2563eb) 16%, transparent);
            color: color-mix(in srgb, var(--ion-color-primary, #2563eb) 82%, #0f172a 18%);
          }
          
          :host ::ng-deep .kanban-list {
            min-height: 84px;
            padding: 0.65rem;
            display: grid;
            gap: 0.55rem;
            align-content: start;
          }
          
          :host ::ng-deep .kanban-list:empty::before {
            content: attr(data-empty-text);
            display: block;
            border: 1px dashed color-mix(in srgb, var(--tw-border, #d7d8da) 78%, transparent);
            border-radius: 10px;
            padding: 0.65rem 0.7rem;
            font-size: 0.84rem;
            color: color-mix(in srgb, var(--tw-text-muted, #6b7280) 86%, transparent);
            font-style: italic;
          }
          
          :host ::ng-deep .kanban-card {
            padding: 0.7rem 0.75rem;
            border-radius: 10px;
            border: 1px solid color-mix(in srgb, var(--tw-border, #d7d8da) 82%, transparent);
            background: color-mix(in srgb, var(--tw-surface, #ffffff) 92%, var(--tw-bg, #f8fafc) 8%);
            color: var(--tw-text, var(--ion-text-color, #0f172a));
            cursor: grab;
            user-select: none;
            transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
          }
          
          :host ::ng-deep .kanban-card:active {
            cursor: grabbing;
          }
          
          :host ::ng-deep .kanban-card-ghost {
            opacity: .35;
          }
          
          :host ::ng-deep .kanban-card-chosen {
            border-color: color-mix(in srgb, var(--ion-color-primary, #2563eb) 56%, transparent);
            box-shadow: 0 0 0 2px rgba(var(--ion-color-primary-rgb, 37, 99, 235), 0.22);
          }
          
          :host ::ng-deep .kanban-card-drag {
            transform: scale(1.01);
            box-shadow: var(--tw-shadow-md, 0 8px 20px rgba(0,0,0,.12));
          }
          
          :host ::ng-deep .kanban-column-ghost {
            opacity: .42;
          }
          
          :host ::ng-deep .kanban-column-chosen {
            border-color: color-mix(in srgb, var(--ion-color-primary, #2563eb) 56%, transparent);
          }
          
          :host ::ng-deep .kanban-column-drag {
            box-shadow: var(--tw-shadow-md, 0 8px 20px rgba(0,0,0,.12));
          }
          '