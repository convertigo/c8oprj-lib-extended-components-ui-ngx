          →: |
            '	::ng-deep {
            	.mat-slider-track-fill{ //line filled
            		background-color: var(--ion-color-primary) !important;
            	}
            	
            	.mat-slider-track-background { // line not filled
            	    background-color: rgba(var(--ion-color-primary-rgb), 0.26);// rgba(12, 187, 231, 0.26) !important;
            	}
            	    
            	.mat-slider-thumb { // circle
            		background-color: var(--ion-color-primary) !important;
            	}
            	
            	.mat-slider-thumb-label { // up circle
            		background-color: var(--ion-color-primary) !important;
            		font-size: 12px; /* Taille de police plus petite */
            		  padding: 4px 8px; /* Espacement interne */
            		  border-radius: 4px; /* Coins arrondis */
            		  min-width: auto; /* Largeur minimale automatique */
            		  white-space: nowrap; /* Empêcher le retour à la ligne */
            	}
            	.mdc-slider__value-indicator{
            		width: 40px;
            	    height: 40px;		
            	}
            	.mdc-slider__value-indicator-text{	
            		width: 40px;
            	}
            	.slider__thumb{
            		min-width: auto;
            	}
            	}
            	
            	width:100%;
            '
