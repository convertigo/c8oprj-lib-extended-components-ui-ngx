↓TickLabels [ngx.components.UICustom-1811000000001]: 
  comment: 'tickLabelInterval: the values under the bar, each centered under its position. aria-hidden: the slider itself gives its value, min and max to assistive technologies.'
  htmlTemplate: |
    <div class="slider-tick-labels" aria-hidden="true" *ngIf="getTickLabels().length > 0">
      <span class="slider-tick-label" *ngFor="let label of getTickLabels()" [style.left]="getTickLabelLeft(label)">{{ label.label }}</span>
    </div>
↓TickLabelsStyle [ngx.components.UIStyle-1811000000002]: 
  comment: 'tickLabelInterval: the row of the values, pulled up under the bar (the mat-slider is 48px high, its bar in the middle). The page may set --slider-tick-label-color, --slider-tick-label-font-size and --slider-tick-labels-offset.'
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.slider-tick-labels {
          	position: relative;
          	display: block;
          	height: 16px;
          	margin-top: var(--slider-tick-labels-offset, -12px);
          	font-size: var(--slider-tick-label-font-size, 12px);
          	line-height: 16px;
          	color: var(--slider-tick-label-color, currentColor);
          	pointer-events: none;
          	user-select: none;
          }
          .slider-tick-label {
          	position: absolute;
          	top: 0;
          	transform: translateX(-50%);
          	white-space: nowrap;
          }
          '
