          ':host {
          	display: block;
          }
          .rtp-viewer {
          	overflow-x: auto;
          	overflow-wrap: anywhere;
          }
          .rtp-viewer ::ng-deep img {
          	max-width: 100%;
          	height: auto;
          }
          .rtp-viewer ::ng-deep table {
          	max-width: 100%;
          	border-collapse: collapse;
          }
          .rtp-viewer ::ng-deep > :first-child {
          	margin-top: 0;
          }
          .rtp-viewer ::ng-deep > :last-child {
          	margin-bottom: 0;
          }
          .rtp-viewer ::ng-deep a {
          	color: var(--ion-color-primary, #2557d6);
          }
          .rtp-viewer ::ng-deep blockquote {
          	margin-left: 0;
          	padding-left: 1em;
          	border-left: 3px solid color-mix(in srgb, currentColor 25%, transparent);
          }
          .rtp-viewer ::ng-deep th,
          .rtp-viewer ::ng-deep td {
          	border-color: color-mix(in srgb, currentColor 30%, transparent);
          }
          .rtp-viewer ::ng-deep code,
          .rtp-viewer ::ng-deep pre {
          	border-radius: 4px;
          	background: color-mix(in srgb, currentColor 8%, transparent);
          }
          .rtp-viewer ::ng-deep code {
          	padding: 0 4px;
          }
          .rtp-viewer ::ng-deep pre {
          	padding: 8px 10px;
          	overflow-x: auto;
          }
          .rtp-viewer ::ng-deep hr {
          	border: 0;
          	border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
          }
