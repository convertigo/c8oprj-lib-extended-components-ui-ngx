  comment: '<p>array or object: the variables, as for richTextPalette. A value is a value or a function returning it, read at each change detection; it is written as text (escaped, its line breaks kept), a date in the language of the application, an array as its values joined by commas.</p><p><b>Example:</b> <code>[{key: &#x27;customer.name&#x27;, value: this.local.customer?.name}, {key: &#x27;order.total&#x27;, value: () =&gt; this.local.total}]</code></p>'
  value: '[]'
↓defaultVariables [ngx.components.UICompVariable-1812100000012]: 
  comment: '<p>boolean or array: the default variables, as for richTextPalette. true (default): all of them; false: none; an array of keys: only these ones.</p><p><b>Example:</b> <code>true</code></p>'
