              '			page.c8o.log.debug(''[MB] '' + props.actionFunction + '': '' + props.actionName);
              			if (vars.agGrid && vars.agGrid != '''') {
              				const api = vars.agGrid.api;
              				const rowCount = api.getDisplayedRowCount();
              				const allCols = api.getAllGridColumns();
              				const header = allCols.map(col => col.getColDef().headerName || col.getColId());
              
              				const allRows: string[] = [header.join(''\t'')];
              
              				for (let i = 0; i < rowCount; i++) {
              					const rowNode = api.getDisplayedRowAtIndex(i);
              					if (rowNode) {
              						const values = allCols.map(col =>
              							rowNode.data[col.getColId()]
              						);
              						allRows.push(values.join(''\t''));
              					}
              				}
              
              				const textToCopy = allRows.join(''\n'');
              				navigator.clipboard.writeText(textToCopy).then(() => {
              					console.log(''Grid rows copied!'');
              				});
              			}
              
              			resolve(null);
              '
