        '/*Begin_c8o_CompImport*/
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public xlsxExporting: boolean = false;
        	public exportMenuId: string = "ag-grid-export-" + Math.random().toString(36).slice(2, 10);
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	gridExportText(key: string): string {
        		const translations: any = {
        			en: {Grid_Export: "Export", Grid_ExportCsv: "CSV", Grid_ExportXlsx: "Excel (.xlsx)", Grid_ExportGenerating: "Generating Excel file…", Grid_ExportFailed: "Excel export failed"},
        			fr: {Grid_Export: "Exporter", Grid_ExportCsv: "CSV", Grid_ExportXlsx: "Excel (.xlsx)", Grid_ExportGenerating: "Génération du fichier Excel…", Grid_ExportFailed: "Échec de l’export Excel"},
        			es: {Grid_Export: "Exportar", Grid_ExportCsv: "CSV", Grid_ExportXlsx: "Excel (.xlsx)", Grid_ExportGenerating: "Generando archivo Excel…", Grid_ExportFailed: "Error al exportar a Excel"},
        			it: {Grid_Export: "Esporta", Grid_ExportCsv: "CSV", Grid_ExportXlsx: "Excel (.xlsx)", Grid_ExportGenerating: "Generazione del file Excel…", Grid_ExportFailed: "Esportazione Excel non riuscita"},
        			"zh-cn": {Grid_Export: "导出", Grid_ExportCsv: "CSV", Grid_ExportXlsx: "Excel (.xlsx)", Grid_ExportGenerating: "正在生成 Excel 文件…", Grid_ExportFailed: "Excel 导出失败"}
        		};
        		const translated = this.translate?.instant?.(key);
        		if (translated != null && translated !== "" && translated !== key) {
        			return translated;
        		}
        		const current = String(this.translate?.currentLang || this.translate?.defaultLang || "en").toLowerCase();
        		const language = current === "zh-cn" || current.startsWith("zh") ? "zh-cn" : current.split("-")[0];
        		return translations[language]?.[key] || translations.en[key] || key;
        	}
        
        	prepareGridExport(agGrid: any, filePrefix?: string): any {
        		const api = agGrid?.api;
        		if (api == null || typeof api.getAllDisplayedColumns !== "function" || typeof api.forEachNodeAfterFilterAndSort !== "function") {
        			throw new Error("Grid export is unavailable");
        		}
        		const columns: any[] = api.getAllDisplayedColumns() || [];
        		if (columns.length === 0) {
        			throw new Error("Grid has no visible columns");
        		}
        		const usedHeaders: any = {};
        		const headers = columns.map((column: any) => {
        			const colDef = column.getColDef?.() || {};
        			const displayed = api.getDisplayNameForColumn?.(column, "csv") || colDef.headerName || colDef.field || column.getColId?.() || "Column";
        			const base = String(displayed);
        			usedHeaders[base] = (usedHeaders[base] || 0) + 1;
        			return usedHeaders[base] === 1 ? base : base + " (" + usedHeaders[base] + ")";
        		});
        		const rows: any[] = [];
        		api.forEachNodeAfterFilterAndSort((node: any) => {
        			const row: any = {};
        			columns.forEach((column: any, index: number) => {
        				const colDef = column.getColDef?.() || {};
        				let value: any;
        				if (typeof api.getCellValue === "function") {
        					try {
        						value = api.getCellValue({rowNode: node, colKey: column, useFormatter: true});
        					}
        					catch (e) {
        						value = undefined;
        					}
        				}
        				if (value === undefined) {
        					value = api.getValue?.(column.getColId?.(), node);
        					if (typeof colDef.valueFormatter === "function") {
        						try {
        							value = colDef.valueFormatter({value: value, data: node.data, node: node, colDef: colDef, column: column, api: api, context: api.getGridOption?.("context")});
        						}
        						catch (e) {
        						}
        					}
        				}
        				row[headers[index]] = value == null ? "" : value;
        			});
        			rows.push(row);
        		});
        		const now = new Date();
        		const stamp = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0"), "_", String(now.getHours()).padStart(2, "0"), String(now.getMinutes()).padStart(2, "0"), String(now.getSeconds()).padStart(2, "0")].join("");
        		const safePrefix = String(filePrefix || "grid").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 64) || "grid";
        		const unique = Math.random().toString(36).slice(2, 8);
        		return {rows: rows, fileName: safePrefix + "_" + stamp + "_" + unique + ".xlsx", sheetName: "Export"};
        	}
        	/*End_c8o_CompFunction*/
