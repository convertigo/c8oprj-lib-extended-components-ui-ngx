                            const component = vars.component;
                            const url = vars.url_path;
                            if (!url) {
                                if (component != null) { component.xlsxExporting = false; }
                                reject(new Error(''Excel export did not return a download URL''));
                                return;
                            }
                            try {
                                const link = document.createElement(''a'');
                                link.href = url;
                                link.target = ''_self'';
                                link.rel = ''noopener'';
                                link.download = vars.file_name || '''';
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                                if (component != null) { component.xlsxExporting = false; }
                                resolve(null);
                            }
                            catch (error) {
                                if (component != null) { component.xlsxExporting = false; }
                                reject(error);
                            }'
