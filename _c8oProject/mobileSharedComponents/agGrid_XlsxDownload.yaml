      ↓PrepareData [ngx.components.UICustomAction-1789568169191]: 
        actionValue: 
          - xmlizable: 
            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		page.c8o.log.debug(''[MB] ''+ props.actionFunction +'': ''+ props.actionName);
                		const api = vars.agGrid.api;
                
                		// Colonnes actuellement affichées, dans l''ordre du Grid
                		const columns = api.getAllDisplayedColumns();
                
                		const exportData = [];
                
                		api.forEachNodeAfterFilterAndSort((node) => {
                			const row: any = {};
                
                			columns.forEach((column) => {
                				const colDef = column.getColDef();
                
                				// Header réellement affiché dans AG Grid
                				const header =
                					api.getDisplayNameForColumn(column, "csv") ||
                					colDef.headerName ||
                					colDef.field ||
                					column.getColId();
                
                				// Valeur du Grid
                				const value = api.getValue(
                					column.getColId(),
                					node
                				);
                
                				row[header] = value;
                			});
                
                			exportData.push(row);
                		});
                		resolve(exportData);
                '
