        			return a ? 1 : -1;
        		}
        		const textA = String(a);
        		const textB = String(b);
        		return this.getAgGridValuesFilterFormats().collator.compare(textA, textB) || (textA < textB ? -1 : (textA > textB ? 1 : 0));
        	}
        
        	// valuesFilter: the values listed with their text, sorted: texts by what the list shows, the others by their value.
        	finishAgGridValuesFilterItems(f: any, items: any[]): any[] {
        		for (const item of items) {
        			if (item.label == null) {
        				item.label = this.getAgGridValuesFilterLabel(f, item);
        			}
        			item.search = null;
        		}
        		const type = this.getAgGridValuesFilterType(f);
        		const collator = this.getAgGridValuesFilterFormats().collator;
        		items.sort((a: any, b: any) => {
        			if (a.key === null || b.key === null) {
        				return a.key === b.key ? 0 : (a.key === null ? -1 : 1);
        			}
        			if (type === "text" || typeof a.key !== typeof b.key) {
        				return collator.compare(a.label, b.label) || this.compareAgGridValuesFilterKeys(a.key, b.key);
        			}
        			return this.compareAgGridValuesFilterKeys(a.key, b.key);
        		});
        		return items;
        	}
        
        	// valuesFilter: the distinct values of the column in the rows of the grid that pass the filters of the other columns (as
        	// Excel lists them); the first row of each value gives it to the valueFormatter.
        	collectAgGridValuesFilterItems(f: any): any[] {
        		const params = f.params || {};
        		const type = this.getAgGridValuesFilterType(f);
        		const byKey = new Map<any, any>();
        		const visit = (node: any) => {
        			if (node == null || node.group === true || node.data == null) {
        				return;
        			}
        			if (typeof params.doesRowPassOtherFilter === "function" && !params.doesRowPassOtherFilter(node)) {
        				return;
        			}
        			let value: any;
        			try {
        				value = params.getValue(node);
        			} catch (e) {
        				value = undefined;
        			}
        			const list = Array.isArray(value) ? (value.length > 0 ? value : [null]) : [value];
        			for (const entry of list) {
        				const key = this.getAgGridValuesFilterKey(entry, type);
        				if (!byKey.has(key)) {
        					byKey.set(key, {key: key, value: entry, node: node, item: Array.isArray(value), label: null});
        				}
        			}
        		};
        		try {
        			if (typeof params.api?.forEachLeafNode === "function") {
        				params.api.forEachLeafNode(visit);
        			}
        			else {
        				params.api?.forEachNode?.(visit);
        			}
        		} catch (e) {
        			this.c8o.log.debug("[MB] agGrid valuesFilter: the values of the rows could not be read : ", e != null ? (e as any).message : e);
        		}
        		return this.finishAgGridValuesFilterItems(f, Array.from(byKey.values()));
        	}
        
        	// valuesFilter: the values given by valuesFilterProvider: values, or {value, label} (an option and its text, a link and the
        	// text of its row); a value given twice is listed once.
        	getAgGridValuesFilterProvidedItems(f: any, list: any[]): any[] {
        		const type = this.getAgGridValuesFilterType(f);
        		const byKey = new Map<any, any>();
        		for (const entry of Array.isArray(list) ? list : []) {
        			const labeled = entry != null && typeof entry === "object" && !(entry instanceof Date) && !Array.isArray(entry) && Object.prototype.hasOwnProperty.call(entry, "value");
        			const value = labeled ? entry.value : entry;
        			const key = labeled ? (value == null || (typeof value === "string" && value.trim() === "") ? null : (typeof value === "object" ? this.getAgGridValuesFilterKey(value, type) : value)) : this.getAgGridValuesFilterKey(value, type);
        			if (byKey.has(key)) {
        				continue;
        			}
        			const label = labeled && key !== null && entry.label != null && String(entry.label).trim() !== "" ? String(entry.label) : null;
        			byKey.set(key, {key: key, value: value, node: null, item: false, label: label});
        		}
        		return this.finishAgGridValuesFilterItems(f, Array.from(byKey.values()));
        	}
        
        	// valuesFilter: reads the values when the popup opens, from the rows of the grid (again when they changed), else from
        	// valuesFilterProvider(column, search): an array, {values, complete} (complete false: only the first values, a search asks
        	// the others), or null for the values of the rows of the grid. An answer after a newer request is dropped.
        	loadAgGridValuesFilterItems(f: any): void {
        		const state = f.state;
        		const provider = this.getAgGridValuesFilterProvider(f);
        		if (provider == null) {
        			if (state.dirty || state.items == null) {
        				state.items = this.collectAgGridValuesFilterItems(f);
        				state.dirty = false;
        			}
        			state.loading = false;
        			state.error = false;
        			state.truncated = false;
        			this.refreshAgGridValuesFilterRows(f);
        			this.renderAgGridValuesFilterRows(f);
        			return;
        		}
        		const ticket = ++state.ticket;
        		const search = state.search || "";
        		state.loading = true;
        		state.error = false;
        		this.refreshAgGridValuesFilterRows(f);
        		this.renderAgGridValuesFilterRows(f);
        		let answer: any;
        		try {
        			answer = provider(this.getAgGridValuesFilterColumnInfo(f), search);
        		} catch (e) {
        			answer = Promise.reject(e);
        		}
        		Promise.resolve(answer).then((result: any) => {
        			if (ticket !== state.ticket || state.destroyed) {
        				return;
        			}
        			state.loading = false;
        			if (result == null) {
        				state.items = this.collectAgGridValuesFilterItems(f);
        				state.truncated = false;
        				state.providedComplete = true;
        			}
        			else {
        				const complete = Array.isArray(result) || result.complete !== false;
        				state.items = this.getAgGridValuesFilterProvidedItems(f, Array.isArray(result) ? result : result.values);
        				state.truncated = !complete;
        				if (search.trim() === "") {
        					state.providedComplete = complete;
        				}
        			}
        			state.dirty = false;
        			this.refreshAgGridValuesFilterRows(f);
        			this.renderAgGridValuesFilterRows(f);
        		}, (error: any) => {
        			if (ticket !== state.ticket || state.destroyed) {
        				return;
        			}
        			state.loading = false;
        			state.error = true;
        			this.c8o.log.debug("[MB] agGrid valuesFilter: valuesFilterProvider failed : ", error != null ? error.message : error);
        			this.refreshAgGridValuesFilterRows(f);
        			this.renderAgGridValuesFilterRows(f);
        		});
        	}
        
        	// valuesFilter: the rows or the cells changed: the values are read again (at once while the popup is open).
        	markAgGridValuesFilterDirty(f: any): void {
        		const state = f.state;
        		if (state == null || state.destroyed) {
        			return;
        		}
        		state.dirty = true;
        		if (!state.attached || this.getAgGridValuesFilterProvider(f) != null) {
        			return;
        		}
        		clearTimeout(state.timers.refresh);
        		state.timers.refresh = setTimeout(() => {
        			state.timers.refresh = null;
        			if (state.attached && !state.destroyed && state.dirty) {
        				state.items = this.collectAgGridValuesFilterItems(f);
        				state.dirty = false;
        				this.refreshAgGridValuesFilterRows(f);
        				this.renderAgGridValuesFilterRows(f);
        			}
        		}, 50);
        	}
        
        	// valuesFilter: the text searched, without case nor accents.
        	normalizeAgGridValuesFilterSearch(text: any): string {
        		return String(text ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
        	}
        
        	// valuesFilter: the rows of the list, (Select All) then the values matching the search.
        	refreshAgGridValuesFilterRows(f: any): void {
        		const state = f.state;
        		const search = this.normalizeAgGridValuesFilterSearch(state.search);
        		const rows: any[] = [];
        		for (const item of state.items || []) {
        			if (search !== "") {
        				if (item.search == null) {
        					item.search = this.normalizeAgGridValuesFilterSearch(item.label);
        				}
        				if (item.search.indexOf(search) < 0) {
        					continue;
        				}
        			}
        			rows.push({kind: "value", item: item});
        		}
        		if (rows.length > 0) {
        			rows.unshift({kind: "all"});
        		}
        		state.rows = rows;
        		if (state.active >= rows.length) {
        			state.active = rows.length - 1;
        		}
        		this.updateAgGridValuesFilterAllState(f);
        	}
        
        	// valuesFilter: (Select All) checked when every value shown is, mixed when some are.
        	updateAgGridValuesFilterAllState(f: any): void {
        		const state = f.state;
        		if (state.selected == null) {
        			state.allState = "checked";
        			return;
        		}
        		let on = 0;
        		let total = 0;
        		for (const row of state.rows) {
        			if (row.kind === "value") {
        				total++;
        				if (state.selected.has(row.item.key)) {
        					on++;
        				}
        			}
        		}
        		state.allState = on === 0 ? "unchecked" : (on === total ? "checked" : "indeterminate");
        	}
        
        	isAgGridValuesFilterChecked(f: any, key: any): boolean {
        		return f.state.selected == null || f.state.selected.has(key);
        	}
        
        	// valuesFilter: a click (or Space) on a row of the list. (Select All) checks or unchecks every value shown (the values found
        	// by the search only); every value of a complete list checked is no filter by values.
        	toggleAgGridValuesFilterRow(f: any, index: number): void {
        		const state = f.state;
        		const row = state.rows?.[index];
        		if (row == null || f.params?.readOnly === true) {
        			return;
        		}
        		const searching = this.normalizeAgGridValuesFilterSearch(state.search) !== "";
        		const everyValue = () => new Set((state.items || []).map((item: any) => item.key));
        		if (row.kind === "all" && !searching) {
        			state.selected = state.allState === "checked" ? new Set() : null;
        		}
        		else if (row.kind === "all") {
        			const selected = state.selected != null ? new Set(state.selected) : everyValue();
        			const on = state.allState !== "checked";
        			for (const other of state.rows) {
        				if (other.kind === "value") {
        					if (on) {
        						selected.add(other.item.key);
        					}
        					else {
        						selected.delete(other.item.key);
        					}
        				}
        			}
        			state.selected = selected;
        		}
        		else {
        			const selected = state.selected != null ? new Set(state.selected) : everyValue();
        			if (selected.has(row.item.key)) {
        				selected.delete(row.item.key);
        			}
        			else {
        				selected.add(row.item.key);
        			}
        			state.selected = selected;
        		}
        		this.normalizeAgGridValuesFilterSelection(f);
        		this.updateAgGridValuesFilterAllState(f);
        		this.renderAgGridValuesFilterRows(f);
        		this.onAgGridValuesFilterUiChanged(f);
        	}
        
        	normalizeAgGridValuesFilterSelection(f: any): void {
        		const state = f.state;
        		const items = state.items || [];
        		if (state.selected != null && !state.truncated && items.length > 0 && items.every((item: any) => state.selected.has(item.key))) {
        			state.selected = null;
        		}
        	}
        
        	// valuesFilter: the list changed: applied at once, after filterParams.debounceMs, or by the Apply button.
        	onAgGridValuesFilterUiChanged(f: any): void {
        		const state = f.state;
        		f.params?.filterModifiedCallback?.();
        		if (this.isAgGridValuesFilterApplyButton(f.params)) {
        			return;
        		}
        		clearTimeout(state.timers.apply);
        		state.timers.apply = null;
        		const delay = Number(f.params?.debounceMs);
        		if (Number.isFinite(delay) && delay > 0) {
        			state.timers.apply = setTimeout(() => this.applyAgGridValuesFilterSelection(f, true), delay);
        		}
        		else {
        			this.applyAgGridValuesFilterSelection(f, true);
        		}
        	}
        
        	// valuesFilter: the values checked become the values kept; the grid is told when they changed (notify).
        	applyAgGridValuesFilterSelection(f: any, notify: boolean): boolean {
        		const state = f.state;
        		clearTimeout(state.timers.apply);
        		state.timers.apply = null;
        		const values = state.selected == null ? null : Array.from(state.selected).sort((a: any, b: any) => this.compareAgGridValuesFilterKeys(a, b));
        		const changed = JSON.stringify(values) !== JSON.stringify(state.applied?.values ?? null);
        		state.applied = values == null ? null : {values: values, set: new Set(values)};
        		if (changed && notify) {
        			f.params?.filterChangedCallback?.({source: "columnFilter"});
        		}
        		return changed;
        	}
        
        	// valuesFilter: the Apply button (or Enter): the values and the condition at once, one change for the grid.
        	applyAgGridValuesFilterAll(f: any): boolean {
        		let changed = this.applyAgGridValuesFilterSelection(f, false);
        		const condition = f.state.condition;
        		if (condition != null && this.isAgGridValuesFilterApplyButton(f.params) && typeof condition.applyModel === "function") {
        			changed = condition.applyModel("ui") === true || changed;
        		}
        		this.updateAgGridValuesFilterToggle(f);
        		if (changed) {
        			f.params?.filterChangedCallback?.({source: "columnFilter"});
        		}
        		return changed;
        	}
        
        	// valuesFilter: every value checked and no condition; apply: at once, one change for the grid (else the Apply button).
        	clearAgGridValuesFilter(f: any, apply: boolean): void {
        		const state = f.state;
        		state.selected = null;
        		state.search = "";
        		if (state.ui?.search != null) {
        			state.ui.search.value = "";
        		}
        		this.refreshAgGridValuesFilterRows(f);
        		this.renderAgGridValuesFilterRows(f);
        		const condition = state.condition;
        		if (!apply) {
        			condition?.onBtClear?.();
        			f.params?.filterModifiedCallback?.();
        			return;
        		}
        		const changed = this.applyAgGridValuesFilterSelection(f, false);
        		const notify = () => {
        			this.updateAgGridValuesFilterToggle(f);
        			f.params?.filterChangedCallback?.({source: "columnFilter"});
        		};
        		if (condition != null && (condition.isFilterActive?.() === true || condition.getModel?.() != null)) {
        			const done = condition.setModel(null);
        			if (done != null && typeof done.then === "function") {
        				done.then(notify);
        			}
        			else {
        				notify();
        			}
        			return;
        		}
        		if (changed) {
        			notify();
        		}
        	}
        
        	onAgGridValuesFilterButton(f: any, type: string, event: any): void {
        		const state = f.state;
        		const applyButton = this.isAgGridValuesFilterApplyButton(f.params);
        		if (type === "apply") {
        			this.applyAgGridValuesFilterAll(f);
        		}
        		else if (type === "clear" || type === "reset") {
        			this.clearAgGridValuesFilter(f, type === "reset" || !applyButton);
        		}
        		else if (type === "cancel") {
        			state.selected = state.applied != null ? new Set(state.applied.values) : null;
        			this.refreshAgGridValuesFilterRows(f);
        			this.renderAgGridValuesFilterRows(f);
        			state.condition?.onBtCancel?.(event);
        		}
        		if ((type === "apply" || type === "cancel") && f.params?.closeOnApply === true) {
        			this.closeAgGridValuesFilter(f, event);
        		}
        	}
        
        	closeAgGridValuesFilter(f: any, event?: any): void {
        		const hide = f.state?.hidePopup;
        		if (typeof hide === "function") {
        			f.state.hidePopup = null;
        			hide(event?.key === "Enter" ? {keyboardEvent: event} : undefined);
        		}
        	}
        
        	// valuesFilter: the popup of the filter: the condition (folded unless it is set), the search box, the list, the buttons.
        	buildAgGridValuesFilterGui(f: any): any {
        		const state = f.state;
        		const id = "aggrid-values-filter-" + Math.random().toString(36).slice(2, 10);
        		const ui: any = state.ui = {id: id};
        		const gui = document.createElement("div");
        		gui.className = "aggrid-values-filter";
        		if (state.condition != null) {
        			const toggle = document.createElement("button");
        			toggle.type = "button";
        			toggle.className = "aggrid-values-filter-condition-toggle";
        			toggle.setAttribute("aria-expanded", "false");
        			toggle.setAttribute("aria-controls", id + "-condition");
        			const icon = document.createElement("span");
        			icon.className = "ag-icon ag-icon-tree-closed";
        			icon.setAttribute("aria-hidden", "true");
        			const label = document.createElement("span");
        			label.className = "aggrid-values-filter-condition-label";
        			label.textContent = this.getAgGridValuesFilterText("condition", "Filter by condition");
        			const dot = document.createElement("span");
        			dot.className = "aggrid-values-filter-condition-dot";
        			dot.setAttribute("aria-hidden", "true");
        			toggle.append(icon, label, dot);
        			toggle.addEventListener("click", () => this.setAgGridValuesFilterConditionOpen(f, !state.conditionOpen, true));
        			const body = document.createElement("div");
        			body.className = "aggrid-values-filter-condition";
        			body.id = id + "-condition";
        			body.hidden = true;
        			const conditionGui = state.condition.getGui?.();
        			if (conditionGui != null) {
        				body.appendChild(conditionGui);
        			}
        			gui.append(toggle, body);
        			Object.assign(ui, {toggle: toggle, toggleIcon: icon, condition: body});
        		}
        		const searchBox = document.createElement("div");
        		searchBox.className = "aggrid-values-filter-search ag-input-field ag-text-field";
        		const searchWrapper = document.createElement("div");
        		searchWrapper.className = "ag-wrapper ag-input-wrapper ag-text-field-input-wrapper";
        		const search = document.createElement("input");
        		search.type = "text";
        		search.className = "ag-input-field-input ag-text-field-input";
        		const placeholder = this.getAgGridValuesFilterText("searchOoo", "Search...");
        		search.placeholder = placeholder;
        		search.setAttribute("aria-label", placeholder);
        		search.setAttribute("aria-controls", id + "-list");
        		search.autocomplete = "off";
        		search.spellcheck = false;
        		search.addEventListener("input", () => this.onAgGridValuesFilterSearch(f));
        		search.addEventListener("keydown", (event: any) => this.onAgGridValuesFilterSearchKey(f, event));
        		searchWrapper.appendChild(search);
        		searchBox.appendChild(searchWrapper);
        		const list = document.createElement("div");
        		list.className = "aggrid-values-filter-list";
        		list.id = id + "-list";
        		list.tabIndex = 0;
        		list.setAttribute("role", "listbox");
        		list.setAttribute("aria-multiselectable", "true");
        		list.setAttribute("aria-label", String(f.params?.colDef?.headerName || f.params?.colDef?.field || this.getAgGridValuesFilterText("searchOoo", "Search...")));
        		const spacer = document.createElement("div");
        		spacer.className = "aggrid-values-filter-spacer";
        		list.appendChild(spacer);
        		list.addEventListener("scroll", () => this.renderAgGridValuesFilterRows(f));
        		list.addEventListener("click", (event: any) => {
        			const item = event?.target?.closest?.(".aggrid-values-filter-item");
        			if (item == null) {
        				return;
        			}
        			event.preventDefault();
        			const index = Number(item.getAttribute("data-index"));
        			state.active = index;
        			this.toggleAgGridValuesFilterRow(f, index);
        		});
        		list.addEventListener("keydown", (event: any) => this.onAgGridValuesFilterListKey(f, event));
        		list.addEventListener("focus", () => {
        			if (state.active < 0 && state.rows.length > 0) {
        				state.active = 0;
        				this.renderAgGridValuesFilterRows(f);
        			}
        		});
        		const note = document.createElement("div");
        		note.className = "aggrid-values-filter-note";
        		note.setAttribute("aria-live", "polite");
        		note.hidden = true;
        		gui.append(searchBox, list, note);
        		const buttons = f.params?.readOnly === true ? [] : this.getAgGridValuesFilterButtons(f.params);
        		if (buttons.length > 0) {
        			const texts: any = {apply: ["applyFilter", "Apply"], clear: ["clearFilter", "Clear"], reset: ["resetFilter", "Reset"], cancel: ["cancelFilter", "Cancel"]};
        			const panel = document.createElement("div");
        			panel.className = "ag-filter-apply-panel aggrid-values-filter-buttons";
        			for (const type of buttons) {
        				const button = document.createElement("button");
        				button.type = "button";
        				button.className = "ag-button ag-standard-button ag-filter-apply-panel-button";
        				button.setAttribute("data-aggrid-values-filter-button", type);
        				button.textContent = this.getAgGridValuesFilterText(texts[type][0], texts[type][1]);
        				button.addEventListener("click", (event: any) => this.onAgGridValuesFilterButton(f, type, event));
        				panel.appendChild(button);
        			}
        			gui.appendChild(panel);
        		}
        		Object.assign(ui, {gui: gui, search: search, list: list, spacer: spacer, note: note});
        		return gui;
        	}
        
        	// valuesFilter: the rows of the list in view (and a few around): the list is virtual, a column of 10,000 values draws 20 rows.
        	renderAgGridValuesFilterRows(f: any): void {
        		const state = f.state;
        		const ui = state.ui;
        		if (ui?.list == null) {
        			return;
        		}
        		const height = 28;
        		const rows = state.rows || [];
        		// the list keeps its height (as the Set Filter of AG Grid): the popup keeps the place AG Grid gave it
        		const visible = Math.ceil((ui.list.clientHeight || height * 8.5) / height);
        		ui.spacer.style.height = rows.length * height + "px";
        		const top = ui.list.scrollTop || 0;
        		const first = Math.max(0, Math.floor(top / height) - 3);
        		const last = Math.min(rows.length - 1, Math.ceil(top / height) + visible + 3);
        		const searching = this.normalizeAgGridValuesFilterSearch(state.search) !== "";
        		// the rows still in view keep their element (a scroll draws only the rows coming into view)
        		const kept = new Map<number, any>();
        		for (const child of Array.from(ui.spacer.children) as any[]) {
        			const index = Number(child.getAttribute("data-index"));
        			if (index >= first && index <= last && child.aggridValuesFilterRow === rows[index]) {
        				kept.set(index, child);
        			}
        			else {
        				child.remove();
        			}
        		}
        		for (let index = first; index <= last; index++) {
        			const row = rows[index];
        			let element = kept.get(index);
        			if (element == null) {
        				element = document.createElement("div");
        				element.aggridValuesFilterRow = row;
        				element.id = ui.id + "-option-" + index;
        				element.setAttribute("role", "option");
        				element.setAttribute("data-index", String(index));
        				element.style.top = index * height + "px";
        				const box = document.createElement("div");
        				const input = document.createElement("input");
        				input.type = "checkbox";
        				input.className = "ag-input-field-input ag-checkbox-input";
        				input.tabIndex = -1;
        				input.setAttribute("aria-hidden", "true");
        				box.appendChild(input);
        				const label = document.createElement("span");
        				label.className = "aggrid-values-filter-label";
        				element.append(box, label);
        				ui.spacer.appendChild(element);
