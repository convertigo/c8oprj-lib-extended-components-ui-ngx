        			box.firstChild.checked = checked === "checked";
        			box.firstChild.indeterminate = checked === "indeterminate";
        			const text = row.kind === "all" ? (searching ? this.getAgGridValuesFilterText("selectAllSearchResults", "(Select All Search Results)") : this.getAgGridValuesFilterText("selectAll", "(Select All)")) : row.item.label;
        			if (element.lastChild.textContent !== text) {
