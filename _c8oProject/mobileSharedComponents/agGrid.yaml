        		}
        		else if (rows.length === 0) {
        			text = this.getAgGridValuesFilterText("noMatches", "No matches");
        		}
        		else if (state.truncated) {
        			text = this.getAgGridValuesFilterText("valuesTruncated", "Only the first {{count}} values are listed: search to find the others", {count: (state.items || []).length});
