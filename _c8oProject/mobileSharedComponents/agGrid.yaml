        		if (state.condition != null) {
        			try {
        				if (typeof f.destroyBean === "function") {
        					f.destroyBean(state.condition);
        				}
        				else {
        					state.condition.destroy?.();
        				}
        			} catch (e) {
        			}
        			state.condition = null;
        		}
        	}
        	
