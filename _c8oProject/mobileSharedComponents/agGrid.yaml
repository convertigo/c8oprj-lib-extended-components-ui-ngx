↓enableRowCreation [ngx.components.UICompVariable-1808000000060]: 
  comment: '<p>boolean: false (default) or true. When true, the grid offers a transactional row creation: <b>Add row</b> opens a draft row pinned at the top of the grid (never hidden by pagination, sorting or filtering), its cells are validated against <code>rowCreationColumns</code>, <b>Save</b> creates the row with one single call and <b>Cancel</b> drops the draft. Nothing reaches the backend before Save. While false, the grid behaves exactly as before.</p><p><b>Example:</b> <code>true</code></p>'
  value: false
↓rowCreationColumns [ngx.components.UICompVariable-1808000000061]: 
  comment: '<p>Rules of the draft row, by column field: <code>{field: {type, required, editable, defaultValue, options, min, max, integer, minLength, maxLength, pattern, validator, message, dateOutput}}</code>. <code>type</code>: text, number, integer, date, boolean, select or multiselect; it selects the cell editor and the value is validated and normalized (number, boolean, YYYY-MM-DD string, option value, array of option values) before submit. <code>editable</code>: true or false forces the draft cell, otherwise the column editable setting applies. <code>options</code>: values or {value, label} objects for select and multiselect. <code>pattern</code>: regular expression. <code>validator</code>: function (value, row, field) or expression using them, returning true, false or an error message. <code>dateOutput</code>: day (default), iso, timestamp or date. A field without rule is free text and optional.</p><p><b>Example:</b> <code>{make: {type: &#x27;select&#x27;, required: true, options: [&#x27;Toyota&#x27;, &#x27;Ford&#x27;]}, price: {type: &#x27;number&#x27;, required: true, min: 0}}</code></p>'
  value: '{}'
↓rowCreationDefaultValues [ngx.components.UICompVariable-1808000000062]: 
  comment: '<p>Initial values of the draft row: an object <code>{field: value}</code> or a function returning one.</p><p><b>Example:</b> <code>{}</code></p>'
  value: '{}'
↓rowCreationCallback [ngx.components.UICompVariable-1808000000063]: 
  comment: <p>Optional function <code>(row, context) =&gt; createdRow | Promise&lt;createdRow&gt;</code> called once, with the validated and normalized row, to create it in the backend. A rejection keeps the draft open and shows the error. When it is not a function, the <code>RowCreate</code> event is fired instead.</p><p><b>Example:</b> <code>null</code></p>
  value: null
↓rowCreationAfterSuccess [ngx.components.UICompVariable-1808000000064]: 
  comment: '<p>What the grid does once the row is created: <code>&#x27;navigate&#x27;</code> (default) adds the created row, goes to its page and flashes it, <code>&#x27;append&#x27;</code> adds it, <code>&#x27;refresh&#x27;</code> reloads an infinite grid (a client side grid is reloaded by the application from the <code>RowCreated</code> event), <code>&#x27;none&#x27;</code> does nothing. An infinite grid is always reloaded.</p><p><b>Example:</b> <code>&#x27;navigate&#x27;</code></p>'
  value: '''navigate'''
↓rowCreationToolbar [ngx.components.UICompVariable-1808000000065]: 
  comment: '<p>boolean: true (default) shows the Add row / Save / Cancel buttons above the grid when enableRowCreation is true. Set false to drive the draft row from your own buttons with <code>agGrid.context.rowCreation.start()</code>, <code>submit()</code> and <code>cancel()</code> (agGrid is <code>event.object.agGrid</code> of the GridReady event).</p><p><b>Example:</b> <code>true</code></p>'
  value: true
