        		const data = {page: target, previousPage: page, pageSize: this.getAgGridExternalPageSize(), rowCount: this.getAgGridExternalRowCount(), button: where};
        		try {
        			// async: the emitter does not wait for the application handler to finish
        			const emitted: any = this.actionBeans.EmitEventAction(this, {event: "lib_ExtendedComponents_ui_ngx.MobileApplication.Application.agGrid.PageRequest", async: true, data: data}, null);
        			emitted?.catch?.((error: any) => this.c8o.log.debug("[MB] agGrid pager: event PageRequest failed : ", error != null ? error.message : error));
        		} catch (e) {
        			this.c8o.log.debug("[MB] agGrid pager: event PageRequest could not be emitted : ", e != null ? (e as any).message : e);
        		}
        	}
        
        	// externalPagination: a text of the pager of AG Grid (to, of, more, page, firstPage...) in the language of the grid:
        	// getLocaleText when it is a function, else the locale of the grid (localeText), else defaultValue (English).
        	getAgGridPagerText(key: string, defaultValue: string): string {
        		try {
        			if (typeof this.getLocaleText == "function") {
        				const custom = this.getLocaleText({key: key, defaultValue: defaultValue});
        				if (typeof custom == "string" && custom != "") {
        					return custom;
        				}
        			}
        		} catch (e) {
        		}
        		const text = this.local?.agGridLang?.[key];
        		return typeof text == "string" && text != "" ? text : defaultValue;
        	}
        
        	computeColumnDef() {
        		if (this.columnDefs == undefined ||  this.columnDefs.length == 0 || this.columnDefs == null) {
        			// extract columnDefs from this.rowData knwing that each element of the array is an object with each key being a column
        			if (this.rowData == undefined || this.rowData.length == 0 || this.rowData == null) {
        				return [];
        			}
        			
        			let keys = Object.keys(this.rowData[0]);
        			let columnDefs = [];
        			keys.forEach((key) => {
        				columnDefs.push({ headerName: key, field: key });
        			});
        			this.columnDefs = columnDefs;
        		}
        		// valuesFilter (off by default) gives copies with the filter by values; row creation disabled (default): the application
        		// column definitions, untouched, as before; columnStyles (off by default) gives copies with the look of their columns
        		const columnDefs = this.getAgGridValuesFilterColumnDefs(this.columnDefs);
        		return this.getAgGridStyledColumnDefs(this.isAgGridRowCreationEnabled() ? this.getAgGridRowCreationColumnDefs(columnDefs) : columnDefs);
        	}
        
