        		if (this.agGridDraftColumnDefs != null && this.agGridDraftColumnDefsSource === source && this.agGridDraftColumnDefsSignature === signature) {
        			return this.agGridDraftColumnDefs;
        		}
        		const wrap = (colDef: any): any => {
        			if (colDef == null || typeof colDef !== "object") {
