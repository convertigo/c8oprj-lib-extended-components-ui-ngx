        			return {component: "agNumberCellEditor", params: {}};
        		}
        		if (type === "date") {
        			return {component: "agDateStringCellEditor", params: {}};
        		}
        		if (type === "boolean") {
        			return {component: "agCheckboxCellEditor"};
        		}
        		if (type === "select") {
        			const options = this.getAgGridDraftOptions(rule);
        			// the list shows the values through the valueFormatter of the column, as the cells do
        			const values = options.map((option: any) => option.value);
        			if (rule.required !== true) {
