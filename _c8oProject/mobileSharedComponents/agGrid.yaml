        	scrollAgGridValuesFilterToActive(f: any): void {
        		const list = f.state.ui?.list;
        		if (list == null || f.state.active < 0) {
        			return;
        		}
        		const height = 28;
        		const top = f.state.active * height;
        		const shown = list.clientHeight || height * 10;
        		if (top < list.scrollTop) {
        			list.scrollTop = top;
        		}
        		else if (top + height > list.scrollTop + shown) {
        			list.scrollTop = top + height - shown;
        		}
        	}
        
        	// valuesFilter: the keyboard in the list: arrows, Home, End, Page Up and Down move, Space checks, Enter closes the popup.
        	onAgGridValuesFilterListKey(f: any, event: any): void {
        		const state = f.state;
        		const count = state.rows.length;
        		if (count === 0) {
        			return;
        		}
        		let active = state.active < 0 ? 0 : state.active;
        		switch (event.key) {
        			case "ArrowDown":
        				active = Math.min(count - 1, active + 1);
        				break;
        			case "ArrowUp":
        				active = Math.max(0, active - 1);
        				break;
        			case "Home":
        				active = 0;
        				break;
        			case "End":
        				active = count - 1;
        				break;
        			case "PageDown":
        				active = Math.min(count - 1, active + 10);
        				break;
        			case "PageUp":
        				active = Math.max(0, active - 10);
        				break;
        			case " ":
        				event.preventDefault();
        				event.stopPropagation();
        				state.active = active;
        				this.toggleAgGridValuesFilterRow(f, active);
        				return;
        			case "Enter":
        				event.preventDefault();
        				event.stopPropagation();
        				this.applyAgGridValuesFilterAll(f);
        				this.closeAgGridValuesFilter(f, event);
        				return;
        			default:
        				return;
        		}
        		event.preventDefault();
        		event.stopPropagation();
        		state.active = active;
        		this.scrollAgGridValuesFilterToActive(f);
        		this.renderAgGridValuesFilterRows(f);
        	}
        
        	// valuesFilter: the search box filters the list (the provider is asked again while its list was not complete).
        	onAgGridValuesFilterSearch(f: any): void {
        		const state = f.state;
        		state.search = state.ui?.search?.value || "";
        		clearTimeout(state.timers.search);
        		const searchNow = () => {
        			state.timers.search = null;
        			state.active = -1;
        			this.refreshAgGridValuesFilterRows(f);
        			if (state.ui?.list != null) {
        				state.ui.list.scrollTop = 0;
        			}
        			this.renderAgGridValuesFilterRows(f);
        		};
        		if (this.getAgGridValuesFilterProvider(f) != null && state.providedComplete !== true) {
        			searchNow();
        			state.timers.search = setTimeout(() => {
        				state.timers.search = null;
        				this.loadAgGridValuesFilterItems(f);
        			}, 300);
        			return;
        		}
        		state.timers.search = setTimeout(searchNow, 100);
        	}
        
        	// valuesFilter: Enter in the search box keeps the values found (as Excel), applies and closes; Arrow Down goes to the list.
        	onAgGridValuesFilterSearchKey(f: any, event: any): void {
        		const state = f.state;
        		if (event.key === "ArrowDown" && state.rows.length > 0) {
        			event.preventDefault();
        			state.active = state.rows.length > 1 ? 1 : 0;
        			state.ui.list.focus();
        			this.scrollAgGridValuesFilterToActive(f);
        			this.renderAgGridValuesFilterRows(f);
        			return;
        		}
        		if (event.key !== "Enter") {
        			return;
        		}
        		event.preventDefault();
        		event.stopPropagation();
        		clearTimeout(state.timers.search);
        		state.timers.search = null;
        		state.search = state.ui?.search?.value || "";
        		this.refreshAgGridValuesFilterRows(f);
        		if (this.normalizeAgGridValuesFilterSearch(state.search) !== "" && state.rows.length > 0) {
        			state.selected = new Set(state.rows.filter((row: any) => row.kind === "value").map((row: any) => row.item.key));
        			this.normalizeAgGridValuesFilterSelection(f);
        		}
        		this.applyAgGridValuesFilterAll(f);
        		this.closeAgGridValuesFilter(f, event);
        	}
        
        	setAgGridValuesFilterConditionOpen(f: any, open: boolean, focus: boolean): void {
        		const ui = f.state.ui;
        		if (ui?.toggle == null) {
        			return;
        		}
        		f.state.conditionOpen = open;
        		ui.condition.hidden = !open;
        		ui.toggle.setAttribute("aria-expanded", open ? "true" : "false");
        		ui.toggleIcon.className = "ag-icon " + (open ? "ag-icon-tree-open" : "ag-icon-tree-closed");
        		if (open && focus) {
        			ui.condition.querySelector?.("input:not([type=hidden]), [tabindex]:not([tabindex=\"-1\"])")?.focus?.();
        		}
        	}
        
        	// valuesFilter: the button of the condition shows a dot while the condition filters.
        	updateAgGridValuesFilterToggle(f: any): void {
        		const toggle = f.state?.ui?.toggle;
        		if (toggle != null) {
        			toggle.classList.toggle("aggrid-values-filter-condition-set", f.state.condition?.isFilterActive?.() === true);
        		}
        	}
        
        	// valuesFilter: the popup opens: the list shows the values kept, read again from the rows or from the provider.
        	showAgGridValuesFilter(f: any, params: any): void {
        		const state = f.state;
        		state.attached = true;
        		state.hidePopup = typeof params?.hidePopup === "function" ? params.hidePopup : null;
        		state.selected = state.applied != null ? new Set(state.applied.values) : null;
        		state.search = "";
        		state.active = -1;
        		state.providedComplete = false;
        		if (state.ui?.search != null) {
        			state.ui.search.value = "";
        		}
        		if (state.ui?.list != null) {
        			state.ui.list.scrollTop = 0;
        		}
        		if (state.condition != null) {
        			try {
        				state.condition.afterGuiAttached?.({...(params || {}), container: "toolPanel", suppressFocus: true});
        			} catch (e) {
