↓suppressMenuHide [ngx.components.UICompVariable-1786460434726]: 
  comment: <p>Keeps the legacy column menu/filter button visible at all times instead of showing it only when hovering over the column header.</p><p><b>Example:</b> <code>false</code></p>
  value: false
↓icons [ngx.components.UICompVariable-1786460482508]: 
  comment: |
    '<p>Replaces AG Grid''s default legacy "menu" icon with a custom icon, for example a filter/funnel icon.</p><p><b>Example:</b> <code>{
        menu: `<span class=''ag-icon ag-icon-filter''></span>`
    }</code></p>'
  value: '{}'
↓showXlsxDownload [ngx.components.UICompVariable-1789565744124]: 
  comment: <p>If true, displays a XLSX download button/menu around the grid.</p><p><b>Example:</b> <code>false</code></p>
  value: false
↓showXlsxDownloadPosition [ngx.components.UICompVariable-1789565844862]: 
  comment: '<p>If showXlsxDownload is true, defines CSV button position relative to the grid: top, bottom, left, right, both_row or both_col.</p><p><b>Example:</b> <code>&#x27;top&#x27;</code></p>'
  value: '''top'''
↓showXlsxDownloadAlignment [ngx.components.UICompVariable-1789565844865]: 
  comment: '<p>If showXlsxDownload is true, defines CSV button alignment: start, center or end.</p><p><b>Example:</b> <code>&#x27;end&#x27;</code></p>'
  value: '''end'''
↓enableRowCreation [ngx.components.UICompVariable-1808000000060]: 
  comment: '<p>boolean: false (default) or true. When true, the grid offers a transactional row creation: <b>Add row</b> opens a draft row pinned at the top of the grid (never hidden by pagination, sorting or filtering), its cells are validated against <code>rowCreationColumns</code>, <b>Save</b> creates the row with one single call and <b>Cancel</b> drops the draft. Nothing reaches the backend before Save. While false, the grid behaves exactly as before.</p><p><b>Example:</b> <code>true</code></p>'
  value: false
↓rowCreationColumns [ngx.components.UICompVariable-1808000000061]: 
  comment: '<p>Rules of the draft row, by column field: <code>{field: {type, required, editable, defaultValue, options, min, max, integer, minLength, maxLength, pattern, validator, message, dateOutput}}</code>. <code>type</code>: text, number, integer, date, boolean, select or multiselect; it selects the cell editor and the value is validated and normalized (number, boolean, YYYY-MM-DD string, option value, array of option values) before submit. <code>editable</code>: true or false forces the draft cell, otherwise the column editable setting applies. <code>options</code>: values or {value, label} objects for select and multiselect. <code>pattern</code>: regular expression. <code>validator</code>: function (value, row, field), returning true, false or an error message. <code>dateOutput</code>: day (default), iso, timestamp or date. A field without rule is free text and optional.</p><p><b>Example:</b> <code>{make: {type: &#x27;select&#x27;, required: true, options: [&#x27;Toyota&#x27;, &#x27;Ford&#x27;]}, price: {type: &#x27;number&#x27;, required: true, min: 0}}</code></p>'
  value: '{}'
↓rowCreationDefaultValues [ngx.components.UICompVariable-1808000000062]: 
  comment: '<p>Initial values of the draft row: an object <code>{field: value}</code> or a function returning one.</p><p><b>Example:</b> <code>{}</code></p>'
  value: '{}'
↓rowCreationCallback [ngx.components.UICompVariable-1808000000063]: 
  comment: <p>Optional function <code>(row, context) =&gt; createdRow | Promise&lt;createdRow&gt;</code> called once, with the validated and normalized row, to create it in the backend. A rejection keeps the draft open and shows the error. When it is not a function, the <code>RowCreate</code> event is fired instead.</p><p><b>Example:</b> <code>null</code></p>
  value: null
↓rowCreationAfterSuccess [ngx.components.UICompVariable-1808000000064]: 
  comment: '<p>What the grid does once the row is created: <code>&#x27;navigate&#x27;</code> (default) adds the created row, goes to its page and flashes it, <code>&#x27;append&#x27;</code> adds it, <code>&#x27;refresh&#x27;</code> reloads an infinite grid (a client side grid is reloaded by the application from the <code>RowCreated</code> event), <code>&#x27;none&#x27;</code> does nothing. An infinite grid is always reloaded.</p><p><b>Example:</b> <code>&#x27;navigate&#x27;</code></p>'
  value: '''navigate'''
↓rowCreationToolbar [ngx.components.UICompVariable-1808000000065]: 
  comment: '<p>boolean: true (default) shows the Add row / Save / Cancel buttons above the grid when enableRowCreation is true. Set false to drive the draft row from your own buttons with <code>agGrid.context.rowCreation.start()</code>, <code>submit()</code> and <code>cancel()</code> (agGrid is <code>event.object.agGrid</code> of the GridReady event).</p><p><b>Example:</b> <code>true</code></p>'
  value: true
↓RowCreate [ngx.components.UICompEvent-1808000000070]: 
  attrName: RowCreate
  comment: 'Fired when a valid draft row is submitted and rowCreationCallback is not a function. Data: {row, success, fail}. Create the row with ONE backend call, then call the agGridCompleteRowCreation action (or event.success(createdRow) / event.fail(error)).'
↓RowCreated [ngx.components.UICompEvent-1808000000071]: 
  attrName: RowCreated
  comment: 'Fired once the row is created. Data: {row: the created row, submitted: the row that was submitted, rowIndex}.'
↓RowCreateCancelled [ngx.components.UICompEvent-1808000000072]: 
  attrName: RowCreateCancelled
  comment: 'Fired when the draft row is cancelled. Nothing was sent to the backend. Data: {row: the dropped draft}.'
↓RowCreateFailed [ngx.components.UICompEvent-1808000000073]: 
  attrName: RowCreateFailed
  comment: 'Fired when the row creation failed. The draft row stays open. Data: {row, error}.'
↓themeStyle [ngx.components.UICompVariable-1790181359671]: 
  comment: '<p>Optional per-instance CSS custom properties applied directly to the AG Grid theme root.</p><p><b>Example:</b> <code>{''--ag-background-color'': ''#ffffff''}</code></p>'
  value: '{}'
↓boxStyle [ngx.components.UICompVariable-1790181376848]: 
  comment: <p>Optional per-instance outer box styles applied to the Grid visual wrapper.</p>
  value: '{}'
↓truncateText [ngx.components.UICompVariable-1810000000010]: 
  comment: '<p>boolean: false (default) or true. When true, each cell shows on one line, a longer content cut with an ellipsis at the width of its column: widening the column shows more of it. The whole content of a cut cell shows in a tooltip when the mouse rests on the cell (300 ms), or when the cell gets the focus from the keyboard (arrows of the grid) or a touch; Escape, leaving the cell or a scroll hides it, and a cell that shows all of its content shows none. A cell renderer can mark the element holding its line with the class <code>aggrid-cell-line</code> and give its whole content in a <code>data-aggrid-full-text</code> attribute. While false, the grid behaves exactly as before.</p><p><b>Example:</b> <code>true</code></p>'
  value: false
↓maxColumnCharacters [ngx.components.UICompVariable-1810000000011]: 
  comment: '<p>number: null (default) or a number of characters. After each sizing pass of the grid (autoSizeColumns, or the fit of the columns to the width of the grid), a column wider than this number of characters (as many "0" in the font of the cells, plus their padding, never under the minWidth of the column) is brought back to it. A column the user resizes keeps its width until the next sizing pass (new rows, a new width of the grid). With truncateText, a longer text is cut at the width of the column.</p><p><b>Example:</b> <code>40</code></p>'
  value: null
↓stickyHeader [ngx.components.UICompVariable-1810000000012]: 
  comment: '<p>boolean: false (default) or true. When true, the header row of a grid taller than the screen stays on screen while the page scrolls its rows, then leaves with the end of the grid, as a frozen row of a spreadsheet. It sticks in the nearest scrolling ancestor of the grid, at stickyHeaderTop: that ancestor must be the box that scrolls (a box with overflow hidden or auto that never scrolls keeps it from sticking). Needs overflow: clip (Safari 16 and later; before, the header scrolls with the rows).</p><p><b>Example:</b> <code>true</code></p>'
  value: false
↓stickyHeaderTop [ngx.components.UICompVariable-1810000000013]: 
  comment: '<p>CSS length: where the header row sticks when stickyHeader is true, from the top of the scrolling container, for example the height of a sticky toolbar above the grid; a var() of a variable the page sets works too.</p><p><b>Example:</b> <code>&#x27;56px&#x27;</code></p>'
  value: '''0px'''
↓externalPagination [ngx.components.UICompVariable-1810000000014]: 
  comment: '<p>boolean: false (default) or true. When true, the rows of the grid are paged by the application (a server gives one page at a time): the grid holds the rows of the page shown, and a pager under it, with the look and the texts of the pager of AG Grid, says which rows they are ("21 to 40 of 250", "Page 2 of 13") and offers the first, previous, next and last pages. A button emits the <code>PageRequest</code> event; the application gives the grid the rows of that page and sets externalPaginationPage. The pagination of AG Grid is off meanwhile. While false, the grid behaves exactly as before.</p><p><b>Example:</b> <code>true</code></p>'
  value: false
↓externalPaginationPage [ngx.components.UICompVariable-1810000000015]: 
  comment: '<p>number: the page shown when externalPagination is true, from 1 (default 1; never past the last page).</p><p><b>Example:</b> <code>2</code></p>'
  value: 1
↓externalPaginationPageSize [ngx.components.UICompVariable-1810000000016]: 
  comment: '<p>number: the number of rows of a page when externalPagination is true; null (default) takes paginationPageSize.</p><p><b>Example:</b> <code>20</code></p>'
  value: null
↓externalPaginationRowCount [ngx.components.UICompVariable-1810000000017]: 
  comment: '<p>number: the number of rows of all the pages when externalPagination is true. null (default) while it is unknown: the pager says "of more", offers the next page while the page shown is full, and no last page.</p><p><b>Example:</b> <code>250</code></p>'
  value: null
↓externalPaginationBusy [ngx.components.UICompVariable-1810000000018]: 
  comment: '<p>boolean: false (default) or true. While true (a page is loading), the buttons of the pager of externalPagination are disabled; they keep the focus of the keyboard.</p><p><b>Example:</b> <code>false</code></p>'
  value: false
↓headerFontFamily [ngx.components.UICompVariable-1810000000040]: 
  comment: '<p>string: null (default) or a list of font families, as the CSS property font-family (names, quoted or not, and generic families such as serif or monospace), or a var() of a variable of the page with such a list as fallback. The font family of the header row: the names of the columns, the group headers and the floating filters. While null, the header keeps the font of the theme; a value that is not a list of font families is ignored.</p><p><b>Example:</b> <code>&#x27;Georgia, &quot;Times New Roman&quot;, serif&#x27;</code></p>'
  value: null
↓headerFontSize [ngx.components.UICompVariable-1810000000041]: 
  comment: '<p>number or string: null (default), a number of pixels or a CSS length (px, pt, em, rem, %), or a var() of a variable of the page. The font size of the header row. While null, the header keeps the font size of the theme; a value that is not a size is ignored. The header row keeps its height: a size much larger than the font of the theme may cut its texts.</p><p><b>Example:</b> <code>13</code></p>'
  value: null
↓cellFontFamily [ngx.components.UICompVariable-1810000000042]: 
  comment: '<p>string: null (default) or a list of font families, as the CSS property font-family (names, quoted or not, and generic families such as serif or monospace), or a var() of a variable of the page with such a list as fallback. The font family of the rows: their cells, the draft row of the row creation, the pinned and full width rows. While null, the rows keep the font of the theme; a value that is not a list of font families is ignored.</p><p><b>Example:</b> <code>&#x27;ui-monospace, Menlo, monospace&#x27;</code></p>'
  value: null
↓cellFontSize [ngx.components.UICompVariable-1810000000043]: 
  comment: '<p>number or string: null (default), a number of pixels or a CSS length (px, pt, em, rem, %), or a var() of a variable of the page. The font size of the rows. While null, the rows keep the font size of the theme; a value that is not a size is ignored. Rows of an automatic height (autoHeight columns) follow the size; rows of a fixed height (rowHeight) keep it.</p><p><b>Example:</b> <code>12</code></p>'
  value: null
↓filterModel [ngx.components.UICompVariable-1851100000002]: 
  comment: '<p>object: null (default) or the filter model of the columns, as <code>getFilterModel()</code> of the grid gives it. While null, the grid keeps the filters its user sets. Otherwise it is applied when the grid is ready and each time it changes: a grid built again (its page left and shown again) gets back the filters its columns had, kept by the application from the filterChanged event of the grid. An empty object clears the filters.</p><p><b>Example:</b> <code>{Status: {filterType: "text", type: "contains", filter: "open"}}</code></p>'
  value: null
↓filterOnMenuButton [ngx.components.UICompVariable-1851100000003]: 
  comment: '<p>boolean: false (default) or true. When true, a filtered column shows it on the button of its menu (the active color of the theme and a dot) and the filter icon of its label is hidden: one icon per header when the menu icon is a funnel (<code>icons: {menu: ...}</code>).</p><p><b>Example:</b> <code>true</code></p>'
  value: false
↓rowId [ngx.components.UICompVariable-1852100000002]: 
  comment: '<p>function: null (default) or a function that gives the identity of a row from its data, a string or a number (null for a row without one). It is read when the grid is created. While null, each new list of rows (rowData) is drawn again whole. Otherwise a new list updates the rows of the same identity: each row keeps its place, its height and its selection, and the grid keeps its height (rows of an automatic height are not measured again). A row without identity, or with the identity of a row before it in the same list, gets one of its own.</p><p><b>Example:</b> <code>(data) =&gt; data?.id</code></p>'
  value: null
↓columnStyles [ngx.components.UICompVariable-1852100000003]: 
  comment: '<p>object: null (default) or the look of some columns, by the field of their column definition: <code>align</code> (left, center or right) and <code>paddingLeft</code>, <code>paddingRight</code> (numbers of pixels, 0 to 60). The cells of the column and its header take them; the alignment also places a block a cell renderer gives (a number right-aligned by its renderer is centered by center). A value that is none of these is ignored, a column without style keeps its look.</p><p><b>Example:</b> <code>{Rate: {align: "center", paddingRight: 24}}</code></p>'
  value: null
↓valuesFilter [ngx.components.UICompVariable-1853100000001]: 
  comment: '<p>boolean: false (default) or true. When true, every column with a filter of AG Grid (filter true, agTextColumnFilter, agNumberColumnFilter or agDateColumnFilter, on the column or from defaultColDef) gets a filter by values, as in Excel: the distinct values of the column in a list of check boxes with a search box, (Select All) and (Blanks), numbers sorted as numbers, dates as dates, texts in natural order. The condition filter of the column stays in the same popup, under Filter by condition; a row is kept when its value is checked and it passes the condition. The values come from the rows of the grid that pass the filters of the other columns, or from valuesFilterProvider. The model of the filter: {filterType: "values", values: [the values kept] or null, condition: the model of the condition filter}. A column keeps its filter with filterParams.valuesFilter false. Other filterParams of a column: valuesFilterType (text, number, date or boolean), valueFormatter (the text of a value in the list), valuesFilterProvider (a function, or false for the values of its rows), debounceMs, buttons (apply, clear, reset, cancel; clear by default).</p><p><b>Example:</b> <code>true</code></p>'
  value: false
↓valuesFilterProvider [ngx.components.UICompVariable-1853100000002]: 
  comment: '<p>function: null (default) or a function (column, search) that gives the values of a column whose rows are filtered or paged by the application (a server): an array of values or of {value, label}, or {values, complete} (complete false: only the first values, a search asks the others), or a Promise of them; null for the values of the rows of the grid. column: {colId, field, headerName, type, colDef, column, api}. The values kept of such a column hide no row in the browser: the application filters the rows from the model of the filter (filterChanged). A column takes the values of its rows with filterParams.valuesFilterProvider false.</p><p><b>Example:</b> <code>(column, search) =&gt; this.readValues(column.field, search)</code></p>'
  value: null
↓valuesFilterTexts [ngx.components.UICompVariable-1853100000003]: 
  comment: '<p>object: null (default) or texts of the filter by values, by key: condition, valuesError, valuesTruncated ({{count}} is the number of values listed), and the texts of AG Grid selectAll, selectAllSearchResults, blanks, searchOoo, noMatches, loadingOoo, clearFilter, applyFilter, resetFilter, cancelFilter, true, false. A text not given is the one of the locale of the grid, else English.</p><p><b>Example:</b> <code>{condition: "Filtrer par condition", selectAll: "(Tout sélectionner)"}</code></p>'
  value: null
↓PageRequest [ngx.components.UICompEvent-1810000000019]: 
  attrName: PageRequest
  comment: 'Fired by a button of the pager of externalPagination. Data: {page: the page asked, from 1, previousPage, pageSize, rowCount, button: first, previous, next or last}. Give the grid the rows of that page, then set externalPaginationPage (and externalPaginationRowCount).'
