        	// valuesFilter: AG Grid gives its popup the class of the theme again, which sets the colors of the theme back: a grid with
        	// colors of its own (themeStyle, a style of the page setting --ag- variables) had a popup in the colors of the theme, a
        	// white popup on a dark grid. The colors the grid has, when they differ from the ones of the popup, are given to the popup
        	// (the condition filter in it takes them too).
        	applyAgGridValuesFilterColors(f: any): void {
        		const popup = f.state.ui?.gui?.closest?.(".ag-popup");
        		const root = f.state.root;
        		if (popup == null || root == null || typeof getComputedStyle !== "function") {
        			return;
        		}
        		const names = ["--ag-background-color", "--ag-foreground-color", "--ag-data-color", "--ag-secondary-foreground-color", "--ag-border-color",
        			"--ag-secondary-border-color", "--ag-row-border-color", "--ag-row-hover-color", "--ag-header-background-color", "--ag-active-color",
        			"--ag-input-border-color", "--ag-input-focus-border-color", "--ag-checkbox-background-color", "--ag-checkbox-checked-color",
        			"--ag-checkbox-unchecked-color", "--ag-menu-background-color", "--ag-control-panel-background-color", "--ag-font-family", "--ag-font-size"];
        		try {
        			const grid = getComputedStyle(root);
        			const own = getComputedStyle(popup);
        			for (const name of names) {
        				const value = grid.getPropertyValue(name).trim();
        				if (value !== "" && value !== own.getPropertyValue(name).trim()) {
