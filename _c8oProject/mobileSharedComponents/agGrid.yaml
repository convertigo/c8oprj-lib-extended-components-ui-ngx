        					if (this.isAgGridDraftNode(params?.node)) {
        						return this.getAgGridDraftRule(field).editable !== false && !this.agGridDraftSubmitting;
        					}
        					return typeof original === "function" ? original(params) : original === true;
        				};
        			}
        			if (this.getAgGridDraftEditor(field) !== undefined) {
        				const original = colDef.cellEditorSelector !== undefined ? colDef.cellEditorSelector : this.defaultColDef?.cellEditorSelector;
        				wrapped.cellEditorSelector = (params: any) => {
        					if (this.isAgGridDraftNode(params?.node)) {
        						return this.getAgGridDraftEditor(field);
        					}
        					return typeof original === "function" ? original(params) : undefined;
        				};
        			}
        			return wrapped;
        		};
        		this.agGridDraftColumnDefs = source.map(wrap);
        		this.agGridDraftColumnDefsSource = source;
        		this.agGridDraftColumnDefsSignature = signature;
        		return this.agGridDraftColumnDefs;
        	}
        
        	cloneAgGridDraftValue(value: any): any {
        		if (value instanceof Date) {
        			return new Date(value.getTime());
        		}
        		if (Array.isArray(value)) {
        			return value.map((item: any) => this.cloneAgGridDraftValue(item));
