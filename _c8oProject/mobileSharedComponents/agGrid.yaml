    ↓DisplayOptionsStyle [ngx.components.UIStyle-1810000000004]: 
      comment: The display options truncateText, stickyHeader, externalPagination and the fonts of the header and of the cells. Their classes are only set while the options are set.
      styleContent: 
        - xmlizable: 
          - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
          - com.twinsoft.convertigo.beans.common.FormatedContent: 
            →: |
              '// truncateText: each cell on one line, cut with an ellipsis at the width of its column; a cell renderer marks the
              // element holding its line with the class aggrid-cell-line
              &.aggrid-truncate-text ::ng-deep {
              	.ag-cell-wrap-text {
              		white-space: nowrap !important;
              	}
              	.ag-cell-value {
              		overflow: hidden;
              		text-overflow: ellipsis;
              	}
              	.aggrid-cell-line {
              		display: block !important;
              		min-width: 0;
              		white-space: nowrap !important;
              		overflow: hidden !important;
              		text-overflow: ellipsis !important;
              	}
              }
              // columnStyles: the alignment of the cells of a column and of its header (a block a cell renderer gives, as a number
              // right-aligned by a flex div, follows it), and the padding of its cells and of its header, 0 to 60 pixels
              ::ng-deep {
              	@each $align, $justify in (left: flex-start, center: center, right: flex-end) {
              		.ag-cell.aggrid-col-align-#{$align} {
              			text-align: $align !important;
              			justify-content: $justify !important;
              		}
              		.ag-cell.aggrid-col-align-#{$align} .ag-cell-wrapper > .ag-cell-value {
              			flex: 1 1 auto;
              			min-width: 0;
              		}
              		.ag-cell.aggrid-col-align-#{$align} > div,
              		.ag-cell.aggrid-col-align-#{$align} .ag-cell-value div,
              		.ag-cell.aggrid-col-align-#{$align} .ag-cell-wrapper {
              			text-align: $align !important;
              			justify-content: $justify !important;
              		}
              		.ag-header-cell.aggrid-col-align-#{$align} .ag-header-cell-label {
              			justify-content: $justify !important;
              			text-align: $align !important;
              		}
              	}
              	@for $px from 0 through 60 {
              		.ag-cell.aggrid-col-pl-#{$px},
              		.ag-header-cell.aggrid-col-pl-#{$px} {
              			padding-left: #{$px}px !important;
              		}
              		.ag-cell.aggrid-col-pr-#{$px},
              		.ag-header-cell.aggrid-col-pr-#{$px} {
              			padding-right: #{$px}px !important;
              		}
              	}
              }
              // filterOnMenuButton: a filtered column shows it on the button of its menu (the active color of the theme and a dot), and
              // the filter icon AG Grid adds to the label of a filtered column is hidden: a menu button drawn as a funnel (icons.menu)
              // made two funnels in the header of a filtered column
              &.aggrid-filter-on-menu ::ng-deep {
              	.ag-header-cell-filtered .ag-header-label-icon.ag-filter-icon {
              		display: none !important;
              	}
              	.ag-header-cell-filtered .ag-header-cell-menu-button {
              		position: relative;
              		opacity: 1;
              		color: var(--ag-active-color, #2196f3);
              	}
              	.ag-header-cell-filtered .ag-header-cell-menu-button .ag-icon {
              		color: var(--ag-active-color, #2196f3);
              	}
              	.ag-header-cell-filtered .ag-header-cell-menu-button::after {
              		content: "";
              		position: absolute;
              		top: 0;
              		right: -3px;
              		width: 6px;
              		height: 6px;
              		border-radius: 50%;
              		background: var(--ag-active-color, #2196f3);
              	}
              }
              // stickyHeader: the header row sticks in .ag-root, as high as the grid: it leaves with the end of the grid. The grid
              // boxes clip (a hidden overflow made them the containers the header stuck in); clip makes no scrolling box, so .ag-root
              // keeps the min-width 0 it had as one and the columns still scroll across inside it. The header is opaque (its color,
              // often see-through, over the background of the grid), under the sticky components of a page (z-index 5).
              &.aggrid-sticky-header ::ng-deep {
              	.ag-root-wrapper {
              		overflow: clip;
              	}
              	.ag-root {
              		overflow: clip;
              		min-width: 0;
              	}
              	.ag-header {
              		position: sticky;
              		top: var(--aggrid-sticky-header-top, 0px);
              		z-index: 4;
              		--aggrid-header-tint: var(--ag-header-background-color, transparent);
              		background-color: var(--ag-background-color, #fff);
              		background-image: linear-gradient(var(--aggrid-header-tint), var(--aggrid-header-tint));
              	}
              	.ag-header:hover {
              		--aggrid-header-tint: var(--ag-header-cell-hover-background-color, #F8FAFC);
              	}
              }
              // externalPagination: the pager of the application under the grid, with the look of the pager of AG Grid (its classes,
              // in the theme of the grid); its buttons are buttons of the page, without a background or a border of their own
              &.aggrid-external-pagination ::ng-deep {
              	.aggrid-external-pager .ag-paging-panel {
              		border-top: none;
              	}
              	.aggrid-external-pager button.ag-paging-button {
              		background: transparent;
              		border: 0;
              		padding: 0;
              		font: inherit;
              		color: inherit;
              	}
              	.aggrid-external-pager button.ag-paging-button.ag-disabled {
              		color: var(--ag-disabled-foreground-color);
              		cursor: default;
              	}
              }
              // headerFontFamily, headerFontSize: the font of the header row (names of the columns, group headers, floating filters);
              // the one not set stays the font of the theme. The icons keep their own font.
              &.aggrid-header-font ::ng-deep .ag-header {
              	font-family: var(--aggrid-header-font-family, var(--ag-font-family));
              	font-size: var(--aggrid-header-font-size, var(--ag-font-size));
              }
              // cellFontFamily, cellFontSize: the font of the rows (their cells, the draft row of the row creation, the pinned and
              // full width rows); the one not set stays the font of the theme. Rows of a fixed height do not grow with the font.
              &.aggrid-cell-font ::ng-deep .ag-row {
              	font-family: var(--aggrid-cell-font-family, var(--ag-font-family));
              	font-size: var(--aggrid-cell-font-size, var(--ag-font-size));
              }
              '
