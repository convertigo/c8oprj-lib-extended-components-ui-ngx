        	// row to the original definition (then to defaultColDef), so existing rows behave as before.
        	// The copies are rebuilt only when the columnDefs reference or the content of the rules changes: a new array on
        	// every change detection pass would make the grid reset its columns for ever.
        	getAgGridRowCreationColumnDefs(source: any): any {
        		if (!Array.isArray(source)) {
        			return source;
        		}
        		let signature = "";
        		try {
        			signature = JSON.stringify(this.rowCreationColumns, (key: string, value: any) => typeof value === "function" ? "function" : (value instanceof RegExp ? String(value) : value)) || "";
        		} catch (e) {
