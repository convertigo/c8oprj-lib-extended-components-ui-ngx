        			}
        			if (Array.isArray(colDef.children)) {
        				return {...colDef, children: colDef.children.map(wrap)};
        			}
        			const field = colDef.field;
        			if (typeof field !== "string" || field === "") {
        				return colDef;
        			}
        			const wrapped: any = {...colDef};
        			wrapped.cellClassRules = {
        				...(colDef.cellClassRules || {}),
        				"ag-grid-draft-cell": (params: any) => this.isAgGridDraftNode(params?.node),
        				"ag-grid-draft-invalid": (params: any) => this.isAgGridDraftNode(params?.node) && this.agGridDraftErrors?.[field] != null && this.agGridDraftTouched?.[field] === true,
        				"ag-grid-draft-required": (params: any) => this.isAgGridDraftNode(params?.node) && this.agGridDraftErrors?.[field] != null && this.agGridDraftTouched?.[field] !== true
        			};
        			const rule = this.getAgGridDraftRule(field);
        			if (rule.editable === true || rule.editable === false) {
        				const original = colDef.editable !== undefined ? colDef.editable : this.defaultColDef?.editable;
