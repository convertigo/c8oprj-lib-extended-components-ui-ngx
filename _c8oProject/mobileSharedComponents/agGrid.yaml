        		if (state == null || this.getAgGridValuesFilterConditionKind(params) !== state.conditionKind) {
        			return false;
        		}
        		f.params = params;
        		state.type = null;
        		const condition = state.condition;
        		if (condition != null && typeof condition.refresh === "function") {
        			try {
        				if (condition.refresh(this.getAgGridValuesFilterConditionParams(f, params)) === false) {
