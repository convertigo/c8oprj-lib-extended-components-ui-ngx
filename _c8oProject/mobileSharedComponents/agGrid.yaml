        				}
        			}
        		} catch (e) {
        		}
        	}
        
        	// valuesFilter: AG Grid keeps a popup in the box of the grid (at most its height, scrolled) and moves it up to fit in it: a
        	// short grid would cut the list or cover the header. While the popup is open the box of the grid lets it out (the style
        	// ValuesFilterStyle, aggrid-values-filter-open where :has() is not supported), and a popup over the header of its column is
        	// placed under it.
        	placeAgGridValuesFilterPopup(f: any): void {
        		const state = f.state;
        		const menu = state.ui?.gui?.closest?.(".ag-popup-child");
        		const root = state.root;
        		if (menu == null || root == null) {
        			return;
        		}
        		menu.style.maxHeight = "none";
        		const colId = typeof f.params?.column?.getColId === "function" ? String(f.params.column.getColId()) : null;
        		let header: any = null;
        		for (const cell of Array.from(root.querySelectorAll(".ag-header-cell")) as any[]) {
        			if (colId != null && cell.getAttribute("col-id") === colId) {
        				header = cell;
        				break;
        			}
        		}
        		if (header == null) {
        			return;
        		}
        		const under = header.getBoundingClientRect().bottom;
        		if (menu.getBoundingClientRect().top < under - 1) {
        			menu.style.top = Math.max(0, Math.round(under - root.getBoundingClientRect().top)) + "px";
        		}
        	}
        
        	// valuesFilter: the popup closes: a change waiting for its debounce is applied now.
        	hideAgGridValuesFilter(f: any): void {
        		const state = f.state;
        		if (state == null) {
