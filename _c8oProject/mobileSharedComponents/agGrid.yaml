          ↓ExternalPager [ngx.components.UICustom-1810000000020]: 
            comment: 'externalPagination: the pager of a grid whose rows are paged by the application, in place of the pager of AG Grid. Its buttons emit PageRequest. The words of the pager are text next to its numbers, and a space separates its two parts: the compiled template drops the blank text between elements.'
            htmlTemplate: |
              <div class="aggrid-external-pager ag-theme-quartz" *ngIf="isAgGridExternalPagination()" [ngStyle]="themeStyle">
                <div class="ag-paging-panel ag-unselectable">
                  <span class="ag-paging-row-summary-panel" role="status">
                    <span class="ag-paging-row-summary-panel-number">{{ getAgGridExternalFirstRow() }}</span>
                    {{ getAgGridPagerText('to', 'to') }}
                    <span class="ag-paging-row-summary-panel-number">{{ getAgGridExternalLastRow() }}</span>
                    {{ getAgGridPagerText('of', 'of') }}
                    <span class="ag-paging-row-summary-panel-number">{{ getAgGridExternalRowCount() ?? getAgGridPagerText('more', 'more') }}</span>
                  </span>
                  {{ ' ' }}
                  <span class="ag-paging-page-summary-panel" role="presentation">
                    <button type="button" class="ag-button ag-paging-button aggrid-external-pager-first" [class.ag-disabled]="!canGoAgGridExternalPage('first')" [attr.aria-disabled]="!canGoAgGridExternalPage('first')" [attr.aria-label]="getAgGridPagerText('firstPage', 'First Page')" (click)="goAgGridExternalPage('first')"><span class="ag-icon ag-icon-first" role="presentation"></span></button>
                    <button type="button" class="ag-button ag-paging-button aggrid-external-pager-previous" [class.ag-disabled]="!canGoAgGridExternalPage('previous')" [attr.aria-disabled]="!canGoAgGridExternalPage('previous')" [attr.aria-label]="getAgGridPagerText('previousPage', 'Previous Page')" (click)="goAgGridExternalPage('previous')"><span class="ag-icon ag-icon-previous" role="presentation"></span></button>
                    <span class="ag-paging-description" role="status">
                      {{ getAgGridPagerText('page', 'Page') }}
                      <span class="ag-paging-number">{{ getAgGridExternalPage() }}</span>
                      {{ getAgGridPagerText('of', 'of') }}
                      <span class="ag-paging-number">{{ getAgGridExternalPageCount() ?? getAgGridPagerText('more', 'more') }}</span>
                    </span>
                    <button type="button" class="ag-button ag-paging-button aggrid-external-pager-next" [class.ag-disabled]="!canGoAgGridExternalPage('next')" [attr.aria-disabled]="!canGoAgGridExternalPage('next')" [attr.aria-label]="getAgGridPagerText('nextPage', 'Next Page')" (click)="goAgGridExternalPage('next')"><span class="ag-icon ag-icon-next" role="presentation"></span></button>
                    <button type="button" class="ag-button ag-paging-button aggrid-external-pager-last" [class.ag-disabled]="!canGoAgGridExternalPage('last')" [attr.aria-disabled]="!canGoAgGridExternalPage('last')" [attr.aria-label]="getAgGridPagerText('lastPage', 'Last Page')" (click)="goAgGridExternalPage('last')"><span class="ag-icon ag-icon-last" role="presentation"></span></button>
                  </span>
                </div>
              </div>
