        					this.gui.className = "ag-grid-draft-multiselect";
        					this.gui.tabIndex = 0;
        					(params.options || []).forEach((option: any) => {
        						const label = document.createElement("label");
        						const box = document.createElement("input");
        						box.type = "checkbox";
        						box.checked = current.some((item: any) => item === option.value || String(item) === String(option.value));
        						(box as any).optionValue = option.value;
        						label.appendChild(box);
        						label.appendChild(document.createTextNode(" " + String(option.label)));
        						this.gui.appendChild(label);
        						this.boxes.push(box);
        					});
