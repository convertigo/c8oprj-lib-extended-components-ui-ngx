            							page.c8o.log.debug(''[MB] defining global function : agGridCompareInsensitive'');
                        	            page.global["agGridCompareInsensitive"] = function(a,b) {
            								if (typeof a === ''string'') {
            					               return a.localeCompare(b);
            								} else {
            					               return (a > b ? 1 : (a < b ? -1 : 0));
            						          }
            							}
            						}
                        	        
                        		    resolve();
            '
