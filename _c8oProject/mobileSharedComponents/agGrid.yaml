    ↓ValuesFilterStyle [ngx.components.UIStyle-1853100000010]: 
      comment: The popup of the filter by values (valuesFilter) in the theme of the grid. Its classes only exist while valuesFilter is true.
      styleContent: 
        - xmlizable: 
          - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
          - com.twinsoft.convertigo.beans.common.FormatedContent: 
            →: |
              '// valuesFilter: the popup of the filter by values, with the colors, the fonts and the check boxes of the theme of the grid
              // (light or dark, from its --ag- variables). While it is open, the box of the grid lets it out: AG Grid keeps a popup in
              // the box of the grid, a short grid cut the list. The list keeps its height (8 rows and a half, as the Set Filter of AG Grid);
              // its rows are placed at their height (28 pixels): only the rows in view are drawn.
              ::ng-deep {
              	.ag-root-wrapper.aggrid-values-filter-open,
              	.ag-root-wrapper:has(> .ag-popup .aggrid-values-filter) {
              		overflow: visible !important;
              	}
              	.ag-popup-child:has(.aggrid-values-filter) {
              		max-height: none !important;
              	}
              	.aggrid-values-filter {
              		display: flex;
              		flex-direction: column;
              		width: 280px;
              		max-width: calc(100vw - 32px);
              		color: var(--ag-foreground-color);
              		font-family: var(--ag-font-family);
              		font-size: var(--ag-font-size);
              		[hidden] {
              			display: none !important;
              		}
              		.aggrid-values-filter-condition-toggle {
              			display: flex;
              			align-items: center;
              			gap: 6px;
              			width: 100%;
              			margin: 0;
              			padding: 8px 12px;
              			border: 0;
              			border-bottom: 1px solid var(--ag-border-color);
              			background: transparent;
              			color: inherit;
              			font: inherit;
              			text-align: left;
              			cursor: pointer;
              		}
              		.aggrid-values-filter-condition-toggle:hover {
              			background-color: var(--ag-row-hover-color);
              		}
              		.aggrid-values-filter-condition-toggle:focus-visible {
              			outline: none;
              			box-shadow: inset 0 0 0 2px var(--ag-input-focus-border-color, var(--ag-active-color, #2196f3));
              		}
              		.aggrid-values-filter-condition-label {
              			flex: 1 1 auto;
              		}
              		.aggrid-values-filter-condition-set .aggrid-values-filter-condition-dot {
              			width: 6px;
              			height: 6px;
              			border-radius: 50%;
              			background: var(--ag-active-color, #2196f3);
              		}
              		.aggrid-values-filter-condition {
              			border-bottom: 1px solid var(--ag-border-color);
              		}
              		.aggrid-values-filter-condition .ag-filter-apply-panel {
              			display: none;
              		}
              		.aggrid-values-filter-search {
              			padding: 8px 12px 4px;
              		}
              		.aggrid-values-filter-search .ag-text-field-input {
              			width: 100%;
              			box-sizing: border-box;
              		}
              		.aggrid-values-filter-list {
              			position: relative;
              			height: calc(28px * 8.5);
              			overflow-x: hidden;
              			overflow-y: auto;
              			margin: 4px 0;
              			outline: none;
