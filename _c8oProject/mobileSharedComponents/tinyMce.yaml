        	private normalizeHugeRteLanguage(language: string): string {
        		switch (language) {
        			case "fr":
        			case "fr_FR":
        				return "fr_FR";
        
        			case "es":
        				return "es";
        
        			case "it":
        				return "it";
        
        			case "zh-CN":
        			case "zh_CN":
        				return "zh_CN";
        
        			case "en":
        				return "en";
        
        			default:
        				return language;
        		}
        	}
        
        	private ensureLocaleRegistered(language: string): boolean {
        		const componentClass: any = this.constructor;
        
        		// English is built into HugeRTE.
        		if (language === "en") {
        			return true;
        		}
        
        		const hugeRte: any = (globalThis as any).hugerte;
        
        		if (hugeRte == null || typeof hugeRte.addI18n !== "function") {
        			return false;
        		}
        
        		if (componentClass.registeredLocales == null) {
        			componentClass.registeredLocales = {};
        		}
        
        		if (componentClass.registeredLocales[language] === true) {
        			return true;
        		}
        
        		let locale: any = null;
        
        		switch (language) {
        			case "fr_FR":
        				locale = componentClass.frFrLocale;
        				break;
        
        			case "es":
        				locale = componentClass.esLocale;
        				break;
        
        			case "it":
        				locale = componentClass.itLocale;
        				break;
        
        			case "zh_CN":
        				locale = componentClass.zhCnLocale;
        				break;
        
        			default:
        				return false;
        		}
        
        		if (locale == null) {
        			return false;
        		}
        
        		hugeRte.addI18n(language, locale);
        		componentClass.registeredLocales[language] = true;
        
        		return true;
        	}
        
        	public mergeInitObject(init: any) {
        		const mergedInit: any = {
        			...init,
        			...this.initOffline
        		};
        
        		if (
        			mergedInit.language == null ||
        			typeof mergedInit.language !== "string"
        		) {
        			return mergedInit;
        		}
        
        		const language = this.normalizeHugeRteLanguage(mergedInit.language);
        
        		if (!this.ensureLocaleRegistered(language)) {
        			return mergedInit;
        		}
        
        		const {
        			language_url,
        			...localizedInit
        		} = mergedInit;
        
        		return {
        			...localizedInit,
        			language
        		};
        	}
        public isDisabled(value: any){
            return value === true || value === "true" || value === 1 || value === "1";
        }
