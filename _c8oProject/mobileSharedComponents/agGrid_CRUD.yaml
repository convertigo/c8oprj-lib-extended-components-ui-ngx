    ↓GetRows [ngx.components.UICustomAsyncAction-1755677200172]: 
      actionValue: 
        - xmlizable: 
          - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
          - com.twinsoft.convertigo.beans.common.FormatedContent: 
            →: |
              '		function suppressKeyboardEvent(e) {
              			if (e.event.key === ''Enter'') {
              				page.local.lastCommitByEnter = true;
              			}
              		}
              
              		function prettifyHeader(key) {
              			return key
              				.replace(/([a-z0-9])([A-Z])/g, ''$1 $2'')
              				.replace(/[_-]/g, '' '').toLowerCase().split('' '')
              				.map(w => (w ? w.charAt(0).toUpperCase() + w.slice(1) : w))
              				.join('' '')
              		}
              
              		function firstNonNullValue(key, rows) {
              			for (const r of rows) {
              				if (r && r.hasOwnProperty(key)) {
              					const v = r[key];
              					if (v !== null && v !== undefined && v !== '''') return v;
              				}
              			}
              			return undefined;
              		}
              
              		function isNumericLike(v) {
              			if (typeof v === ''number'') return Number.isFinite(v);
              			if (typeof v === ''string'' && v.trim() !== '''') {
              				const n = Number(v.replace(/\s/g, '''').replace('','', ''.'')); // 1 234,56 -> 1234.56
              				return Number.isFinite(n);
              			}
              			return false;
              		}
              
              		function parseDateLoose(v) {
              			if (v instanceof Date && !isNaN(Number(v))) return v;
              			if (typeof v === ''number'' && Number.isFinite(v)) {
              				const d = new Date(v); // epoch ms
              				return isNaN(Number(d)) ? null : d;
              			}
              			if (typeof v === ''string'') {
              				// ISO, YYYY-MM-DD, DD/MM/YYYY, DD/MM/YYYY HH:mm[:ss]
              				const s = v.trim();
              
              				// DD/MM/YYYY[ HH:mm[:ss]]
              				const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
              				if (m) {
              					const [, dd, mm, yyyy, HH = ''0'', MM = ''0'', SS = ''0''] = m;
              					const year = Number(yyyy.length === 2 ? (Number(yyyy) + 2000) : yyyy);
              					const d = new Date(year, Number(mm) - 1, Number(dd), Number(HH), Number(MM), Number(SS));
              					return isNaN(Number(d)) ? null : d;
              				}
              
              				const d2 = new Date(s); // ISO, RFC, etc.
              				return isNaN(Number(d2)) ? null : d2;
              			}
              			return null;
              		}
              
              		function toNumberLoose(v) {
              			if (typeof v === ''number'') return v;
              			if (typeof v === ''string'' && v.trim() !== '''') {
              				// "1 234,56" => 1234.56
              				const n = Number(v.replace(/\s/g, '''').replace('','', ''.''));
              				return Number.isFinite(n) ? n : NaN;
              			}
              			return NaN;
              		}
              
              		function inferFilterAndParams(sample) {
              			// Bool
              			if (typeof sample === ''boolean'' || (typeof sample === ''string'' && /^(true|false)$/i.test(sample))) {
              				return {
              					filter: ''agSetColumnFilter'',
              					filterParams: { values: [true, false] }
              				};
              			}
              
              			// Nombre
              			if (isNumericLike(sample)) {
              				return {
              					filter: ''agNumberColumnFilter'',
              					filterParams: { resetButton: true, applyButton: true, debounceMs: 200 },
              					cellClass: [''ag-right-aligned-cell'', ''num-cell''],
              					cellClassRules: {
              						''num-negative'': params => {
              							const n = toNumberLoose(params.value);
              							return Number.isFinite(n) && n < 0;
              						}
              					},
              					cellStyle: params => {
              						const n = toNumberLoose(params.value);
              						if (Number.isFinite(n) && n < 0) {
              							return { color: "red" };
              						}
              					}
              				};
              			}
              
              			// Date
              			const parsed = parseDateLoose(sample);
              			if (parsed) {
              				return {
              					filter: ''agDateColumnFilter'',
              					filterParams: {
              						resetButton: true, applyButton: true, debounceMs: 200,
              						comparator: (filterLocalDateAtMidnight, cellValue) => {
              							const d = parseDateLoose(cellValue);
              							if (!d) return -1;
              							const cell = new Date(d.getFullYear(), d.getMonth(), d.getDate());
              							if (cell < filterLocalDateAtMidnight) return -1;
              							if (cell > filterLocalDateAtMidnight) return 1;
              							return 0;
              						}
              					},
              					valueFormatter: params => {
              						const d = parseDateLoose(params.value);
              						if (!d) return '''';
              						const y = d.getFullYear();
              						const m = String(d.getMonth() + 1).padStart(2, ''0'');
              						const day = String(d.getDate()).padStart(2, ''0'');
              						return y + ''-'' + m + ''-'' + day;
              					}
              				};
              			}
              
              			// Texte
              			return {
              				filter: ''agTextColumnFilter'',
              				filterParams: { resetButton: true, applyButton: true, debounceMs: 200 }
              			};
              		}
              		try {
              			page.c8o.log.debug(''[MB] '' + props.actionFunction + '': '' + props.actionName);
              			
              			let args = { limit: props.out.limit, offset: props.out.skip };
              			if (props.out.sortModel.length > 0) {
              				let sortModel = props.out.sortModel[0];
              				args[''order_by''] = sortModel.colId + '' '' + sortModel.sort;
              			}
              			
              			let table = await page.call(page.table + ''_LIST'', args);
              			let RowData = table.row ?? [];
              
              			let ColDef = [];
              
              			if (RowData.length > 0 && props.out.skip == 0) {
              				const firstRow = RowData[0];
              				ColDef = Object.keys(firstRow).map(key => {
              					const sample = firstNonNullValue(key, RowData);
              					const { filter, filterParams, valueFormatter, cellClass, cellClassRules, cellStyle } = inferFilterAndParams(sample);
              
              					const col: any = {
              						headerName: prettifyHeader(key),
              						field: key,
              						filter,
              						filterParams,
              						suppressKeyboardEvent
              					};
              					if (valueFormatter) col.valueFormatter = valueFormatter;
              					if (cellClass) col.cellClass = cellClass;
              					if (cellClassRules) col.cellClassRules = cellClassRules;
              					if (cellStyle) col.cellStyle = cellStyle;
              					return col;
              				});
              			}
              			let lastRow = undefined;
              			RowData.length = RowData.length ?? 0;
              			if (RowData.length < props.out.limit) {
              				lastRow = props.out.startRow + RowData.length;
              			}
              			for (let c of ColDef) {
              				if (c.field in page.customColDef) {
              					const custom = page.customColDef[c.field];
              					for (let k in custom) {
              						c[k] = custom[k];
              					}
              				}
              			}
              			ColDef.unshift({
              				headerCheckboxSelection: true,
              				checkboxSelection: true,
              				showDisabledCheckboxes: true,
              				editable: false,
              				sortable: false,
              				filter: false,
              				maxWidth: 40,
              				hide: !page.local.enabledDelete
              			});
              			return { RowData, ColDef, lastRow };
              		} catch (e) {
              
              		} finally {
              		}
              		return {};
              '
