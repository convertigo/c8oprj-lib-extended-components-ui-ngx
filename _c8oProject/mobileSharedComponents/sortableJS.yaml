        /*Begin_c8o_CompFunction*/
        	public ensureElementId(): void {
        		if (this.id != undefined && this.id != null && this.id !== "") {
        			this.sortableElementId = this.id;
        			return;
        		}
        		if (!this.sortableElementId) {
        			this.sortableElementId = "sortablejs-" + Date.now();
        		}
        	}
        
        	public destroySortable(): void {
        		if (this.sortableInstance && typeof this.sortableInstance.destroy === "function") {
        			this.sortableInstance.destroy();
        		}
        		this.sortableInstance = null;
        	}
        
        	public parseArray(value: any, fallback: any[] = []): any[] {
        		if (Array.isArray(value)) {
        			return value;
        		}
        		if (typeof value === "string" && value.trim() !== "") {
        			try {
        				var parsed = JSON.parse(value);
        				return Array.isArray(parsed) ? parsed : fallback;
        			} catch (e) {
        				this.c8o.log.warn("[MB] sortableJS invalid items JSON: " + e);
        			}
        		}
        		return fallback;
        	}
        
        	public parseObject(value: any, fallback: any = {}): any {
        		if (value != null && typeof value === "object" && !Array.isArray(value)) {
        			return value;
        		}
        		if (typeof value === "string" && value.trim() !== "") {
        			try {
        				var parsed = JSON.parse(value);
        				return (parsed != null && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : fallback;
        			} catch (e) {
        				this.c8o.log.warn("[MB] sortableJS invalid options JSON: " + e);
        			}
        		}
        		return fallback;
        	}
        
        	public coerceBoolean(value: any, fallback: boolean): boolean {
        		if (typeof value === "boolean") {
        			return value;
        		}
        		if (typeof value === "string") {
        			if (value.toLowerCase() === "true") {
        				return true;
        			}
        			if (value.toLowerCase() === "false") {
        				return false;
        			}
        		}
        		return fallback;
        	}
        
        	public toNumber(value: any, fallback: number): number {
        		if (typeof value === "number" && !isNaN(value)) {
        			return value;
        		}
        		if (typeof value === "string") {
        			var parsed = parseFloat(value);
        			if (!isNaN(parsed)) {
        				return parsed;
        			}
        		}
        		return fallback;
        	}
        
        	public resolveItemLabel(item: any, index: number): string {
        		if (item == null) {
        			return "Item " + (index + 1);
        		}
        		if (typeof item === "string" || typeof item === "number" || typeof item === "boolean") {
        			return "" + item;
        		}
        		if (typeof item === "object") {
        			if (item.label != undefined && item.label != null) {
        				return "" + item.label;
        			}
        			if (item.name != undefined && item.name != null) {
        				return "" + item.name;
        			}
        			if (item.title != undefined && item.title != null) {
        				return "" + item.title;
        			}
        		}
        		return "Item " + (index + 1);
        	}
        
        	public getCurrentOrder(list: any): any[] {
        		var ordered: any[] = [];
        		if (!list) {
        			return ordered;
        		}
        		var nodes = list.querySelectorAll(".sortablejs-item");
        		for (var i = 0; i < nodes.length; i++) {
        			var node: any = nodes[i];
        			var originalIndex = parseInt(node.getAttribute("data-index"), 10);
        			if (!isNaN(originalIndex) && this.renderedItems[originalIndex] != undefined) {
        				ordered.push(this.renderedItems[originalIndex]);
        				node.setAttribute("data-index", "" + (ordered.length - 1));
        			}
        		}
        		return ordered;
        	}
        
        	public renderSortable(): void {
        		try {
        			this.ensureElementId();
        			var container = document.getElementById(this.sortableElementId);
        			if (!container) {
        				return;
        			}
        			this.destroySortable();
        			container.innerHTML = "";
        			var list = document.createElement("div");
        			list.className = "sortablejs-list";
        			var sourceItems = this.parseArray(this.items, []);
        			this.renderedItems = sourceItems.slice();
        
        			if (this.renderedItems.length === 0) {
        				var empty = document.createElement("div");
        				empty.className = "sortablejs-empty";
        				empty.innerText = (this.emptyText != undefined && this.emptyText != null && this.emptyText !== "") ? ("" + this.emptyText) : "Drop items here";
        				list.appendChild(empty);
        			} else {
        				for (var i = 0; i < this.renderedItems.length; i++) {
        					var item = this.renderedItems[i];
        					var row = document.createElement("div");
        					row.className = "sortablejs-item";
        					row.setAttribute("data-index", "" + i);
        					row.innerText = this.resolveItemLabel(item, i);
        					((itemIndex: number, payload: any, element: any) => {
        						element.addEventListener("click", () => {
        							this.ItemClicked.emit({index: itemIndex, item: payload});
        						});
        					})(i, item, row);
        					list.appendChild(row);
        				}
        			}
        			container.appendChild(list);
        
        			var SortableCtor = window["Sortable"];
        			if (!SortableCtor) {
        				this.c8o.log.warn("[MB] sortableJS script is not loaded yet");
        				return;
        			}
        
        			var userOptions = this.parseObject(this.options, {});
        			var mergedOptions = {
        				animation: this.toNumber(this.animation, 150),
        				disabled: this.coerceBoolean(this.disabled, false),
        				sort: this.coerceBoolean(this.sort, true),
        				handle: (this.handle != undefined && this.handle != null && this.handle !== "") ? this.handle : undefined,
        				ghostClass: (this.ghostClass != undefined && this.ghostClass != null && this.ghostClass !== "") ? this.ghostClass : "sortablejs-ghost",
        				chosenClass: (this.chosenClass != undefined && this.chosenClass != null && this.chosenClass !== "") ? this.chosenClass : "sortablejs-chosen",
        				dragClass: (this.dragClass != undefined && this.dragClass != null && this.dragClass !== "") ? this.dragClass : "sortablejs-drag",
        				onStart: (evt: any) => {
        					var idx = evt && evt.oldIndex != undefined ? evt.oldIndex : -1;
        					var startItem = (idx >= 0 && idx < this.renderedItems.length) ? this.renderedItems[idx] : null;
        					this.DragStarted.emit({oldIndex: idx, item: startItem, items: this.renderedItems.slice()});
        				},
        				onEnd: (evt: any) => {
        					var ordered = this.getCurrentOrder(list);
        					if (ordered.length > 0 || this.renderedItems.length === 0) {
        						this.renderedItems = ordered.slice();
        					}
        					var payload = {
        						oldIndex: evt && evt.oldIndex != undefined ? evt.oldIndex : -1,
        						newIndex: evt && evt.newIndex != undefined ? evt.newIndex : -1,
        						items: this.renderedItems.slice()
        					};
        					this.OrderChanged.emit(payload);
        					this.DragEnded.emit(payload);
        					if (this.coerceBoolean(this.emitItemsOnChange, true)) {
        						this.ItemsChanged.emit(this.renderedItems.slice());
        					}
        				}
        			};
        
        			mergedOptions = {
        				...mergedOptions,
        				...userOptions
        			};
        
        			this.sortableInstance = new SortableCtor(list, mergedOptions);
        		} catch (e) {
        			this.c8o.log.warn("[MB] sortableJS render failed: " + e);
        		}
        	}
        	/*End_c8o_CompFunction*/
        '
