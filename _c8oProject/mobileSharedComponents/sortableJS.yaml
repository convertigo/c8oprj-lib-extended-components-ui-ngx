        '/*Begin_c8o_CompImport*/
        declare var window: any;
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public sortableInstance: any;
        	public sortableElementId: string = "";
        	public renderedItems: any[] = [];
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		this.destroySortable();
        	/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		if (changes["id"] && this.id && this.id !== "" && this.id !== this.sortableElementId) {
        			this.sortableElementId = this.id;
        		}
        		if (this.sortableElementId && (changes["items"] || changes["options"] || changes["width"] || changes["height"] || changes["id"] || changes["animation"] || changes["disabled"] || changes["sort"] || changes["handle"] || changes["ghostClass"] || changes["chosenClass"] || changes["dragClass"] || changes["emptyText"] || changes["emitItemsOnChange"])) {
        			setTimeout(() => this.renderSortable(), 0);
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
