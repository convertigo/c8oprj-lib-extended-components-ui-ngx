        →: |
          '.sortablejs-host {
            display: block;
            min-height: 120px;
            padding: 2px;
          }
          
          :host ::ng-deep .sortablejs-list {
            display: grid;
            gap: 0.5rem;
            align-content: start;
          }
          
          :host ::ng-deep .sortablejs-item {
            padding: 0.72rem 0.9rem;
            border-radius: 10px;
            border: 1px solid color-mix(in srgb, var(--tw-border, #d7d8da) 86%, transparent);
            background: var(--tw-surface, var(--ion-card-background, #ffffff));
            box-shadow: var(--tw-shadow-sm, 0 1px 2px rgba(0,0,0,.06));
            color: var(--tw-text, var(--ion-text-color, #0f172a));
            cursor: grab;
            user-select: none;
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
          }
          
          :host ::ng-deep .sortablejs-item:active {
            cursor: grabbing;
          }
          
          :host ::ng-deep .sortablejs-ghost {
            opacity: .35;
          }
          
          :host ::ng-deep .sortablejs-chosen {
            border-color: color-mix(in srgb, var(--ion-color-primary, #2563eb) 58%, transparent);
            box-shadow: 0 0 0 2px color-mix(in srgb, rgba(var(--ion-color-primary-rgb, 37,99,235), 0.22) 100%, transparent);
          }
          
          :host ::ng-deep .sortablejs-drag {
            opacity: .95;
            transform: scale(1.01);
            box-shadow: var(--tw-shadow-md, 0 8px 20px rgba(0,0,0,.12));
          }
          
          :host ::ng-deep .sortablejs-empty {
            padding: 0.75rem 0.9rem;
            border: 1px dashed color-mix(in srgb, var(--tw-border, #d7d8da) 82%, transparent);
            border-radius: 10px;
            color: color-mix(in srgb, var(--tw-text-muted, #6b7280) 86%, transparent);
            font-style: italic;
          }
          '