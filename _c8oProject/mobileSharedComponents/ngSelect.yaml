↓addTag [ngx.components.UICompVariable-1741016698867]: 
  comment: Allows to create custom options.
  value: false
↓addTagText [ngx.components.UICompVariable-1741016698870]: 
  comment: Set custom text when using tagging
  value: '''Add item'''
↓appearance [ngx.components.UICompVariable-1741016698873]: 
  comment: Allows to select dropdown appearance. Set to outline to add border instead of underline (applies only to Material theme)
  value: '''underline'''
↓appendTo [ngx.components.UICompVariable-1741016698876]: 
  comment: Append dropdown to body or any other element using css selector. For correct positioning body should have position:relative
  value: null
↓bindValue [ngx.components.UICompVariable-1741016698879]: 
  comment: Object property to use for selected model. By default binds to whole object.
  value: null
↓bindLabel [ngx.components.UICompVariable-1741016698882]: 
  comment: Object property to use for label. Default label
  value: '''label'''
↓closeOnSelect [ngx.components.UICompVariable-1741016698885]: 
  comment: Whether to close the menu when a value is selected
  value: true
↓clearAllText [ngx.components.UICompVariable-1741016698888]: 
  comment: Set custom text for clear all icon title
  value: '''Clear all'''
↓clearable [ngx.components.UICompVariable-1741016698891]: 
  comment: Allow to clear selected value. Default true
  value: true
↓clearOnBackspace [ngx.components.UICompVariable-1741016698894]: 
  comment: Clear selected values one by one when clicking backspace. Default true
  value: true
↓compareWith [ngx.components.UICompVariable-1741016698897]: 
  comment: A function to compare the option values with the selected values. The first argument is a value from an option. The second is a value from the selection(model). A boolean should be returned.
  value: null
↓dropdownPosition [ngx.components.UICompVariable-1741016698900]: 
  comment: Set the dropdown position on open -- bottom | top | auto
  value: '''auto'''
↓groupBy [ngx.components.UICompVariable-1741016698903]: 
  comment: Allow to group items by key or function expression
  value: null
↓groupValue [ngx.components.UICompVariable-1741016698906]: 
  comment: Function expression to provide group value
  value: null
↓selectableGroup [ngx.components.UICompVariable-1741016698909]: 
  comment: Allow to select group when groupBy is used
  value: false
↓selectableGroupAsModel [ngx.components.UICompVariable-1741016698912]: 
  comment: Indicates whether to select all children or group itself
  value: true
↓items [ngx.components.UICompVariable-1741016698915]: 
  comment: Items array
  value: '[]'
↓loading [ngx.components.UICompVariable-1741016698918]: 
  comment: You can set the loading state from the outside (e.g. async items loading)
  value: null
↓loadingText [ngx.components.UICompVariable-1741016698921]: 
  comment: Set custom text when for loading items
  value: '''Loading...'''
↓labelForId [ngx.components.UICompVariable-1741016698924]: 
  comment: Id to associate control with label.
  value: null
↓markFirst [ngx.components.UICompVariable-1741016698927]: 
  comment: Marks first item as focused when opening/filtering.
  value: true
↓isOpen [ngx.components.UICompVariable-1741016698930]: 
  comment: Allows manual control of dropdown opening and closing. true - won't close. false - won't open.
