comment: 'A rich text editor (HugeRTE, through the tinyMce component) with a palette of variables, after the Description of C8Oforms: its menu bar and toolbar, and a palette like its data palette (a search field, groups that fold, with their icon and count, the variables with their icon, second line and type). A click on a variable, or a drag and drop into the text, writes it at that place. The variables are written in the HTML as {{ key }} placeholders, shown in the editor as chips. The variables input lists the variables of the application; default variables (date, signed-in user, language) are offered too. Light or dark as the page behind it (theme input). Typical use: bind html to a variable of the page and set that variable again from event.html in onChange; give the same html and variables to richTextPaletteViewer, which shows the text with the values of the variables (the editor never reads the values).'
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        import { NgZone } from "@angular/core";
        import { defineCustomElement as rtpDefineIonIcon } from "ionicons/components/ion-icon.js";
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	// #rich-text-palette: the HugeRTE editor of the inner tinyMce component, set by the setup of its init (rtpSetup)
        	public rtpEditor: any = null;
        	public rtpReady: boolean = false;
        	// the text typed in the search field of the palette
        	public rtpSearch: string = "";
        	// the variables of the palette (rtpVariables), computed again at each change detection
        	public rtpCurrentVariables: any[] = [];
        	// the key of the variable under the pointer or the focus: the foot of the palette describes it
        	public rtpHover: string = null;
        	// the groups of the palette the author folded (true) or unfolded (false), by "#" + title
        	public rtpFolded: any = {};
        	// the look of the component (rtpDetectLook): its theme, light or dark, and the colors its editor needs
        	public rtpLook: any = null;
        	// one item, the signature of the look: the editor is created again when it changes (HugeRTE reads its skin at its start)
        	public rtpLooks: string[] = [];
        	// the HTML last loaded into the editor or given by onChange, with its {{ }} placeholders: an html input equal to it
        	// is not loaded again (the page that keeps the HTML of onChange gives it back)
        	private rtpLastHtml: string = null;
        	// the text of the editor of the former look, loaded into the next one
        	private rtpPendingHtml: string = null;
        	private rtpInit: any = null;
        	private rtpGroups: any[] = [];
        	private rtpGroupsSignature: string = null;
        	private rtpChipsSignature: string = null;
        	private rtpChangeTimer: any = null;
        	private rtpLookTimer: any = null;
        	private rtpLoading: boolean = false;
        	private rtpZone: any = null;
        	private rtpIcons: any = {};
        	// what stops watching the theme of the page and the width of the editor
        	private rtpThemeWatchers: any[] = [];
        	private rtpSizeWatcher: any = null;
        	// the type of the data a variable of the palette carries while it is dragged
        	public readonly rtpDragType: string = "application/x-c8o-rich-text-variable";
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		// the ion-icon element, for the Ionicons icons of the palette, whatever the pages of the application use
        		try {
        			rtpDefineIonIcon();
        		}
        		catch (e) {
        		}
        		this.rtpCurrentVariables = this.rtpVariables();
        		this.rtpRefreshLook();
        		this.rtpWatchTheme();
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		// the text typed less than a moment ago is still given (onChange) before the editor goes away
        		try {
        			this.rtpEmitChange();
        		}
        		catch (e) {
        		}
        		this.rtpUnwatchTheme();
        		this.rtpUnwatchSize();
        		this.rtpEditor = null;
        		this.rtpReady = false;
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		if (changes["html"] != null) {
        			this.rtpLoadHtml(false);
        		}
        		if (changes["theme"] != null && !changes["theme"].firstChange) {
        			this.rtpScheduleLook();
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		this.rtpCheckVariables();
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		// the look read again once the page is laid out
        		this.rtpScheduleLook();
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	/**
        	 * #rich-text-palette: a variable key as a placeholder writes it ({{ key }}), or null when it cannot be one: not empty, at
        	 * most 200 characters, without brace, angle bracket, quote, backquote, backslash nor ampersand. Spaces (and the no-break
        	 * spaces an editor writes) are trimmed and collapsed.
        	 */
        	public rtpCleanKey(raw: any): string {
        		if (raw == null || typeof raw === "object" || typeof raw === "function") {
        			return null;
        		}
        		const key = ("" + raw).replace(/&nbsp;|&#160;|&#xa0;| /gi, " ").replace(/\s+/g, " ").trim();
        		if (key === "" || key.length > 200 || /[{}<>"''`\\&]/.test(key)) {
        			return null;
        		}
        		return key;
        	}
        
        	/** #rich-text-palette: the {{ key }} placeholders of an HTML text: in its text only, a placeholder in a tag is no variable. */
        	public rtpPlaceholderPattern(): RegExp {
        		return /\{\{([^{}<>]*?)\}\}(?![^<]*>)/g;
        	}
        
        	public rtpEscape(text: any): string {
        		return ("" + (text == null ? "" : text)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/''/g, "&#39;");
        	}
        
        	public rtpDecode(text: any): string {
        		return ("" + (text == null ? "" : text)).replace(/&quot;/g, "\"").replace(/&#39;|&#x27;|&apos;/gi, "''").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
        	}
        
        	/**
        	 * #rich-text-palette: the clock of the device, in its time zone, as the descriptions of C8Oforms read it (api.clock):
        	 * "now" as ISO 8601 with the local offset (2026-11-24T14:32:05+01:00), "today" as YYYY-MM-DD, "time" as HH:mm, "year".
        	 */
        	public rtpClock(kind: string, date: Date = new Date()): any {
        		const pad = (n: number) => (n < 10 ? "0" : "") + n;
        		const day = date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
        		const time = pad(date.getHours()) + ":" + pad(date.getMinutes());
        		if (kind == "today") {
        			return day;
        		}
        		if (kind == "time") {
        			return time;
        		}
        		if (kind == "year") {
        			return date.getFullYear();
        		}
        		let offset = -date.getTimezoneOffset();
        		const sign = offset < 0 ? "-" : "+";
        		offset = Math.abs(offset);
        		return day + "T" + time + ":" + pad(date.getSeconds()) + sign + pad(Math.floor(offset / 60)) + ":" + pad(offset % 60);
        	}
        
        	/** #rich-text-palette: the user of the Convertigo session when signed in, else null. */
        	public rtpSessionUser(): any {
        		try {
        			const user: any = (this as any).c8o?.session?.user;
        			return user != null && user.authenticated === true ? user : null;
        		}
        		catch (e) {
        			return null;
        		}
        	}
        
        	/**
        	 * #rich-text-palette: the variables offered by default, with the keys of the placeholders of C8Oforms (api.*) so a text
        	 * reads the same in both, and the icons, types and second lines of the palette of C8Oforms. A variable of the variables
        	 * input with the same key replaces its label, group, description, icon, type or value.
        	 */
        	public rtpDefaultVariables(): any[] {
        		const text = (value: any) => value == null ? "" : "" + value;
        		const given = (value: any) => value != null && ("" + value).trim() !== "";
        		const userId = () => text(this.rtpSessionUser()?.name);
        		const example = (value: any) => "e.g. " + value;
        		const self: any = this;
        		return [
        			{ key: "api.clock.today", label: "Today''s date", group: "Date and time", icon: "lucide:calendar", type: "Date", sub: example(this.rtpClock("today")), value: () => this.rtpClock("today") },
        			{ key: "api.clock.now", label: "Date and time", group: "Date and time", icon: "lucide:calendar-clock", type: "Date and time", sub: example(this.rtpClock("now")), value: () => this.rtpClock("now") },
        			{ key: "api.clock.time", label: "Time", group: "Date and time", icon: "lucide:clock", type: "Time", sub: example(this.rtpClock("time")), value: () => this.rtpClock("time") },
        			{ key: "api.clock.year", label: "Year", group: "Date and time", icon: "lucide:hash", type: "Number", sub: example(this.rtpClock("year")), value: () => this.rtpClock("year") },
        			{ key: "api.user.name", label: "User name", group: "Signed-in user", icon: "lucide:user", type: "Text", sub: "The name of the signed-in user", value: () => given(self.userName) ? text(self.userName) : userId() },
        			{
        				key: "api.user.email", label: "User e-mail", group: "Signed-in user", icon: "lucide:mail", type: "Text", sub: "The e-mail address of the signed-in user", value: () => {
        					if (given(self.userEmail)) {
        						return text(self.userEmail);
        					}
        					const id = userId();
        					return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id) ? id : "";
        				}
        			},
        			{ key: "api.user.authenticatedUserID", label: "User ID", group: "Signed-in user", icon: "lucide:key-round", type: "Text", sub: "The ID of the signed-in user", value: userId },
        			{
        				key: "api.user.groups", label: "User groups", group: "Signed-in user", icon: "lucide:users", type: "List", sub: "Labels separated by commas", value: () => {
        					const groups = this.rtpSessionUser()?.groups;
        					return Array.isArray(groups) ? groups.map((group: any) => group != null && typeof group === "object" ? text(group.name) : text(group)).filter((group: string) => group !== "").join(", ") : "";
        				}
        			},
        			{ key: "api.translate.currentLang", label: "Language", group: "Application", icon: "lucide:languages", type: "Text", sub: example(text(self.translate?.currentLang || self.translate?.defaultLang || "en")), value: () => text(self.translate?.currentLang || self.translate?.defaultLang) }
        		];
        	}
        
        	/** #rich-text-palette: the keys of the default variables to offer: null for all of them (the default), [] for none. */
        	public rtpDefaultKeys(): string[] {
        		const option: any = (this as any).defaultVariables;
        		if (option === false || option === "false" || option === 0) {
        			return [];
        		}
        		let keys: any[] = null;
        		if (Array.isArray(option)) {
        			keys = option;
        		}
        		else if (typeof option === "string" && option.trim() !== "" && option.trim() !== "true") {
        			keys = option.split(",");
        		}
        		return keys == null ? null : keys.map((key) => this.rtpCleanKey(key)).filter((key) => key != null);
        	}
        
        	/** #rich-text-palette: an array or an object given as such or as its JSON text, else null. */
        	public rtpParseJson(source: any, input: string): any {
        		if (typeof source !== "string") {
        			return source;
        		}
        		const json = source.trim();
        		if (json.charAt(0) == "[" || json.charAt(0) == "{") {
        			try {
        				return JSON.parse(json);
        			}
        			catch (e) {
        				console.warn("[richTextPalette] " + input + ": invalid JSON", e);
        			}
        		}
        		return null;
        	}
        
        	/**
        	 * #rich-text-palette: the variables of the variables input: an array of { key, label, group, description, icon, type,
        	 * value } (a string is a key), or an object { key: value } (or { key: { label, group, description, icon, type, value } }),
        	 * or the JSON text of one of them. A value is a value or a function computing it when the text is shown. The first one
        	 * of a key is kept.
        	 */
        	public rtpCustomVariables(): any[] {
        		const source: any = this.rtpParseJson((this as any).variables, "variables");
        		const result: any[] = [];
        		const seen: any = {};
        		const given = (value: any) => value != null && ("" + value).trim() !== "";
        		const add = (rawKey: any, def: any) => {
        			const key = this.rtpCleanKey(rawKey);
        			if (key == null || seen["#" + key] === true) {
        				return;
        			}
        			seen["#" + key] = true;
        			result.push({
        				key: key,
        				label: given(def.label) ? "" + def.label : null,
        				group: def.group != null ? "" + def.group : null,
        				description: given(def.description) ? "" + def.description : null,
        				icon: given(def.icon) ? ("" + def.icon).trim() : null,
        				type: given(def.type) ? "" + def.type : null,
        				hasValue: Object.prototype.hasOwnProperty.call(def, "value"),
        				value: def.value
        			});
        		};
        		if (Array.isArray(source)) {
        			for (const def of source) {
        				if (typeof def === "string") {
        					add(def, {});
        				}
        				else if (def != null && typeof def === "object") {
        					add(def.key != null ? def.key : def.name, def);
        				}
        			}
        		}
        		else if (source != null && typeof source === "object") {
        			for (const name of Object.keys(source)) {
        				const entry = source[name];
        				const isDefinition = entry != null && typeof entry === "object" && !Array.isArray(entry) && !(entry instanceof Date)
        					&& ("value" in entry || "label" in entry || "group" in entry || "description" in entry || "icon" in entry || "type" in entry);
        				add(name, isDefinition ? entry : { value: entry });
        			}
        		}
        		return result;
        	}
        
        	/**
        	 * #rich-text-palette: the variables, as { key, label, group, description, sub, icon, type, value }: the variables of the
        	 * variables input first, then the default variables kept by defaultVariables (one of them redefined by the variables
        	 * input stays in place).
        	 */
        	public rtpVariables(): any[] {
        		const keep = this.rtpDefaultKeys();
        		const byKey: any = {};
        		const defaults: any[] = [];
        		if (keep == null || keep.length > 0) {
        			for (const def of this.rtpDefaultVariables()) {
        				if (keep == null || keep.indexOf(def.key) != -1) {
        					const item = { key: def.key, label: def.label, group: def.group, description: "", sub: def.sub, icon: def.icon, type: def.type, value: def.value };
        					byKey["#" + def.key] = item;
        					defaults.push(item);
        				}
        			}
        		}
        		const custom: any[] = [];
        		for (const def of this.rtpCustomVariables()) {
        			const existing = byKey["#" + def.key];
        			if (existing != null) {
        				existing.label = def.label != null ? def.label : existing.label;
        				existing.group = def.group != null ? def.group : existing.group;
        				existing.description = def.description != null ? def.description : existing.description;
        				existing.icon = def.icon != null ? def.icon : existing.icon;
        				existing.type = def.type != null ? def.type : existing.type;
        				existing.value = def.hasValue ? def.value : existing.value;
        			}
        			else {
        				custom.push({ key: def.key, label: def.label != null ? def.label : def.key, group: def.group != null ? def.group : "", description: def.description != null ? def.description : "", sub: "", icon: def.icon, type: def.type, value: def.value });
        			}
        		}
        		return custom.concat(defaults);
        	}
        
        	public rtpFind(key: any): any {
        		const clean = this.rtpCleanKey(key);
        		for (const variable of this.rtpCurrentVariables || []) {
        			if (variable.key === clean) {
        				return variable;
        			}
        		}
        		return null;
        	}
        
        	/**
        	 * #rich-text-palette: the variables are read again at each change detection; when a key or a label changes (variables
        	 * given later by the page, another language), the chips of the editor are written again from the placeholders.
        	 */
        	public rtpCheckVariables(): void {
        		this.rtpCurrentVariables = this.rtpVariables();
        		const signature = JSON.stringify(this.rtpCurrentVariables.map((variable) => [variable.key, variable.label]));
        		if (this.rtpChipsSignature != null && signature !== this.rtpChipsSignature && this.rtpEditor != null && this.rtpReady) {
        			setTimeout(() => this.rtpRefreshChips());
        		}
        		this.rtpChipsSignature = signature;
        	}
        
        	public rtpRefreshChips(): void {
        		const editor = this.rtpEditor;
        		if (editor == null || !this.rtpReady) {
        			return;
        		}
        		try {
        			const html = editor.getContent();
        			this.rtpLoading = true;
        			editor.setContent(html);
        		}
        		catch (e) {
        			console.error("[richTextPalette] the chips of the variables could not be written again", e);
        		}
        		finally {
        			this.rtpLoading = false;
        		}
        	}
        
        	public rtpNormalizeText(text: any): string {
        		return ("" + (text == null ? "" : text)).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
        	}
        
        	/**
        	 * #rich-text-palette: the icons of the palette, drawn after Lucide (https://lucide.dev, ISC License, Copyright (c) Lucide
        	 * Contributors), the icons of the palette of C8Oforms.
        	 */
        	public rtpIconShapes(): any {
        		return {
        			"calendar": "<path d=''M8 2v4''/><path d=''M16 2v4''/><rect width=''18'' height=''18'' x=''3'' y=''4'' rx=''2''/><path d=''M3 10h18''/>",
        			"calendar-clock": "<path d=''M16 14v2.2l1.6 1''/><path d=''M16 2v4''/><path d=''M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5''/><path d=''M3 10h5''/><path d=''M8 2v4''/><circle cx=''16'' cy=''16'' r=''6''/>",
        			"clock": "<circle cx=''12'' cy=''12'' r=''10''/><path d=''M12 6v6l4 2''/>",
        			"hash": "<line x1=''4'' x2=''20'' y1=''9'' y2=''9''/><line x1=''4'' x2=''20'' y1=''15'' y2=''15''/><line x1=''10'' x2=''8'' y1=''3'' y2=''21''/><line x1=''16'' x2=''14'' y1=''3'' y2=''21''/>",
        			"user": "<path d=''M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2''/><circle cx=''12'' cy=''7'' r=''4''/>",
        			"mail": "<path d=''m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7''/><rect x=''2'' y=''4'' width=''20'' height=''16'' rx=''2''/>",
        			"key-round": "<path d=''M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z''/><circle cx=''16.5'' cy=''7.5'' r=''.5'' fill=''currentColor''/>",
        			"users": "<path d=''M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2''/><path d=''M16 3.128a4 4 0 0 1 0 7.744''/><path d=''M22 21v-2a4 4 0 0 0-3-3.87''/><circle cx=''9'' cy=''7'' r=''4''/>",
        			"languages": "<path d=''m5 8 6 6''/><path d=''m4 14 6-6 2-3''/><path d=''M2 5h12''/><path d=''M7 2h1''/><path d=''m22 22-5-10-5 10''/><path d=''M14 18h6''/>",
        			"app-window": "<rect x=''2'' y=''4'' width=''20'' height=''16'' rx=''2''/><path d=''M10 4v4''/><path d=''M2 8h20''/><path d=''M6 4v4''/>",
        			"folder": "<path d=''M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z''/>",
        			"variable": "<path d=''M8 21s-4-3-4-9 4-9 4-9''/><path d=''M16 3s4 3 4 9-4 9-4 9''/><line x1=''15'' x2=''9'' y1=''9'' y2=''15''/><line x1=''9'' x2=''15'' y1=''9'' y2=''15''/>",
        			"search": "<path d=''m21 21-4.34-4.34''/><circle cx=''11'' cy=''11'' r=''8''/>",
        			"chevron-right": "<path d=''m9 18 6-6-6-6''/>",
        			"list-collapse": "<path d=''M10 5h11''/><path d=''M10 12h11''/><path d=''M10 19h11''/><path d=''m3 10 3-3-3-3''/><path d=''m3 20 3-3-3-3''/>",
        			"list-tree": "<path d=''M8 5h13''/><path d=''M13 12h8''/><path d=''M13 19h8''/><path d=''M3 10a2 2 0 0 0 2 2h3''/><path d=''M3 5v12a2 2 0 0 0 2 2h3''/>"
        		};
        	}
        
        	/**
        	 * #rich-text-palette: an icon of the palette as a CSS url() of the data URL of its SVG, null if unknown. An icon is drawn
        	 * as a mask in the color of the text (class rtp-dp-ico, its url in --rtp-icon), so it follows the theme.
        	 */
        	public rtpIcon(name: string): string {
        		if (this.rtpIcons[name] === undefined) {
        			const shapes = this.rtpIconShapes()[name];
        			this.rtpIcons[name] = shapes == null ? null : "url(\"data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns=''http://www.w3.org/2000/svg'' viewBox=''0 0 24 24'' fill=''none'' stroke=''black'' stroke-width=''2'' stroke-linecap=''round'' stroke-linejoin=''round''>" + shapes + "</svg>") + "\")";
        		}
        		return this.rtpIcons[name];
        	}
        
        	/**
        	 * #rich-text-palette: the icon of a group or of a variable, as { mask, name }: the name of an Ionicons icon of the
        	 * application ("person-outline", shown by an ion-icon), or a CSS url() drawn as a mask in the color of the text: an icon
        	 * of the palette ("lucide:calendar") or the URL of an SVG file ("assets/icons/customer.svg", "https://...",
        	 * "data:image/svg+xml;..."; only its shape counts). Without one, the icon of the palette named fallback.
        	 */
        	public rtpIconRef(icon: any, fallback: string): any {
        		const value = icon == null ? "" : ("" + icon).trim().replace(/[\r\n]/g, "");
        		if (value.indexOf("lucide:") == 0 || value === "") {
