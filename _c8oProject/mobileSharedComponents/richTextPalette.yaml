↓html [ngx.components.UICompVariable-1812000000020]: 
  comment: '<p>string: the HTML of the text, its variables written as {{ key }} placeholders. Loaded into the editor at its start and each time the page gives another HTML than the one onChange last gave. A placeholder of a key the palette does not have stays as written.</p><p><b>Example:</b> <code>&#x27;&lt;p&gt;Hello {{ customer.name }}&lt;/p&gt;&#x27;</code></p>'
↓variables [ngx.components.UICompVariable-1812000000021]: 
  comment: '<p>array or object: the variables of the application, listed first in the palette. An array of { key, label, group, description, icon, type, value } (a string is a key), or an object { key: value }. key: the name written in the placeholder (letters, digits, dots, spaces; no brace, angle bracket, quote, backslash nor ampersand). label: the text of the palette and of the chip (default: the key). group: the title of its group in the palette. description: its second line in the palette. icon: the name of an Ionicons icon of the application (''person-outline''), the URL of an SVG file, or an icon of the palette (''lucide:calendar''); drawn in the color of the text. type: the badge on its right (''Text'', ''Date''...). value: a value, or a function returning it, read by richTextPaletteViewer. A variable with the key of a default variable replaces its label, group, description, icon, type or value.</p><p><b>Example:</b> <code>[{key: &#x27;customer.name&#x27;, label: &#x27;Customer name&#x27;, group: &#x27;Customer&#x27;, icon: &#x27;person-outline&#x27;, type: &#x27;Text&#x27;, value: this.local.customer?.name}, {key: &#x27;order.total&#x27;, label: &#x27;Order total&#x27;, group: &#x27;Order&#x27;, description: &#x27;Taxes included&#x27;, value: () =&gt; this.local.total + &#x27; EUR&#x27;}, {key: &#x27;api.user.name&#x27;, label: &#x27;Author&#x27;}]</code></p>'
  value: '[]'
↓defaultVariables [ngx.components.UICompVariable-1812000000022]: 
  comment: '<p>boolean or array: the default variables of the palette. true (default): all of them (api.clock.today, api.clock.now, api.clock.time, api.clock.year, api.user.name, api.user.email, api.user.authenticatedUserID, api.user.groups, api.translate.currentLang). false: none. An array (or a comma-separated text) of keys: only these ones.</p><p><b>Example:</b> <code>[&#x27;api.clock.today&#x27;, &#x27;api.user.name&#x27;, &#x27;api.user.email&#x27;]</code></p>'
  value: true
↓palettePosition [ngx.components.UICompVariable-1812000000023]: 
  comment: '<p>string: where the palette stands: ''end'' (default, after the editor, as in C8Oforms), ''start'' (before it), ''top'', ''bottom'', or ''none'' (no palette: the placeholders of the HTML are still shown as chips). Beside the editor, the palette is as high as the editor and about 28% of the window wide (320 to 520 pixels, at most half of the component); under 720 pixels of width, it goes above the editor.</p><p><b>Example:</b> <code>&#x27;end&#x27;</code></p>'
  value: '''end'''
↓paletteTitle [ngx.components.UICompVariable-1812000000024]: 
  comment: '<p>string: the title of the palette.</p><p><b>Example:</b> <code>&#x27;Variables&#x27;</code></p>'
  value: '''Variables'''
↓paletteHint [ngx.components.UICompVariable-1812000000025]: 
  comment: '<p>string: the help text at the foot of the palette, where the variable under the pointer is described; false hides the foot.</p><p><b>Example:</b> <code>&#x27;Click a variable or drag it into the text.&#x27;</code></p>'
  value: '''Click a variable or drag it into the text.'''
↓paletteSearch [ngx.components.UICompVariable-1812000000026]: 
