  value: '''auto'''
↓searchPlaceholder [ngx.components.UICompVariable-1812000000027]: 
  comment: '<p>string: the placeholder of the search field of the palette.</p><p><b>Example:</b> <code>&#x27;Search&#x27;</code></p>'
  value: '''Search'''
↓placeholder [ngx.components.UICompVariable-1812000000028]: 
  comment: '<p>string: the text the editor shows while it is empty.</p><p><b>Example:</b> <code>&#x27;Write your text here&#x27;</code></p>'
↓height [ngx.components.UICompVariable-1812000000029]: 
  comment: '<p>number or string: the height of the editor (pixels or a CSS length).</p><p><b>Example:</b> <code>400</code></p>'
  value: 400
↓disabled [ngx.components.UICompVariable-1812000000030]: 
  comment: '<p>boolean: the editor is read only and the palette inserts nothing.</p><p><b>Example:</b> <code>false</code></p>'
  value: false
↓init [ngx.components.UICompVariable-1812000000031]: 
  comment: '<p>object: options of HugeRTE over the ones of the component, which are those of the Description of C8Oforms (menu bar, toolbar, plugins, quick toolbar on a selection), the oxide or oxide-dark skin and the default or dark content for the theme, the height and placeholder inputs and the language of the application. Read when the editor starts. Its content_style is added to the style of the text and the chips; its setup runs after the one of the component.</p><p><b>Example:</b> <code>{menubar: false, toolbar: &#x27;undo redo | bold italic | bullist numlist&#x27;, plugins: &#x27;lists&#x27;}</code></p>'
  value: '{}'
↓theme [ngx.components.UICompVariable-1812000000032]: 
  comment: '<p>string: the theme of the editor and its palette: ''auto'' (default: light or dark as the page behind the component, read again when the page changes its theme), ''light'' or ''dark''. Dark, the colors come from the Ionic colors of the application (--ion-card-background, --ion-text-color, --ion-border-color, --ion-color-primary). A change of theme starts the editor again, with its text.</p><p><b>Example:</b> <code>&#x27;auto&#x27;</code></p>'
  value: '''auto'''
↓groups [ngx.components.UICompVariable-1812000000033]: 
  comment: '<p>array or object: the icon of a group of the palette, and whether it starts folded. An array of { name, icon, open }, or an object { name: icon } or { name: { icon, open } }. name: the group of the variables. icon: as the icon of a variable. open: false folds the group at the start. A group without an icon gets a folder; the default groups keep theirs.</p><p><b>Example:</b> <code>{&#x27;Customer&#x27;: &#x27;person-outline&#x27;, &#x27;Order&#x27;: {icon: &#x27;cart-outline&#x27;, open: false}}</code></p>'
  value: '{}'
↓paletteTexts [ngx.components.UICompVariable-1812000000034]: 
  comment: '<p>object: the other texts of the palette: empty (shown when the search finds no variable), foldAll and unfoldAll (the button beside the search field).</p><p><b>Example:</b> <code>{empty: &#x27;Aucune variable trouvée.&#x27;, foldAll: &#x27;Tout replier&#x27;, unfoldAll: &#x27;Tout déplier&#x27;}</code></p>'
  value: '{}'
↓onChange [ngx.components.UICompEvent-1812000000040]: 
  attrName: onChange
  comment: 'Fired when the text changes (250 ms after the last keystroke, at once for a variable inserted). Data: { html, variables }: the HTML with its {{ key }} placeholders, and the keys of the placeholders it holds. htmlChange gives the same HTML (two-way binding of html).'
↓onBlur [ngx.components.UICompEvent-1812000000041]: 
  attrName: onBlur
  comment: 'Fired when the editor loses the focus, after onChange when the text changed. Data: { html, variables }.'
↓onReady [ngx.components.UICompEvent-1812000000042]: 
  attrName: onReady
  comment: 'Fired when the editor has started and loaded its text, and again when a change of theme has started a new editor. Data: { editor }: the HugeRTE editor.'
