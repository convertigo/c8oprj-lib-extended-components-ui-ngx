        →: |
          '.frappe-gantt-host {
            display: block;
            min-height: 220px;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
          }
          
          .frappe-gantt-host .gantt-container {
            height: 100%;
          }
          
          .frappe-gantt-host .gantt-container svg.gantt {
            height: 100%;
            display: block;
          }
          
          :host ::ng-deep .frappe-gantt-host .gantt-container {
            height: 100% !important;
          }
          
          :host ::ng-deep .frappe-gantt-host .gantt-container .gantt {
            display: block;
            min-height: 100%;
          }
          '