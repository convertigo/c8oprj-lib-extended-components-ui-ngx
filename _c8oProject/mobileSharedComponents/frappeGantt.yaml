comment: |
  Shared component wrapping the Frappe Gantt chart library.
  Pass tasks as an array or as a JSON string.
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        declare var window: any;
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public ganttInstance: any;
        	public ganttElementId: string = '''';
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		if (changes[''id''] && this.id && this.id !== '''' && this.id !== this.ganttElementId) {
        			this.ganttElementId = this.id;
        		}
        		if (this.ganttElementId && (changes[''tasks''] || changes[''options''] || changes[''viewMode''] || changes[''dateFormat''] || changes[''width''] || changes[''height''] || changes[''id''])) {
        			setTimeout(() => this.renderGantt(), 0);
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	public ensureElementId(): void {
        		if (this.id != undefined && this.id != null && this.id !== '''') {
        			this.ganttElementId = this.id;
        			return;
        		}
        		if (!this.ganttElementId) {
        			this.ganttElementId = ''frappe-gantt-'' + Date.now();
        		}
        	}
        
        	public parseArray(value: any, fallback: any[] = []): any[] {
        		if (Array.isArray(value)) {
        			return value;
        		}
        		if (typeof value === ''string'' && value.trim() !== '''') {
        			try {
        				var parsed = JSON.parse(value);
        				return Array.isArray(parsed) ? parsed : fallback;
        			} catch (e) {
        				this.c8o.log.warn(''[MB] frappeGantt invalid tasks JSON: '' + e);
        			}
        		}
        		return fallback;
        	}
        
        	public parseObject(value: any, fallback: any = {}): any {
        		if (value != null && typeof value === ''object'' && !Array.isArray(value)) {
        			return value;
        		}
        		if (typeof value === ''string'' && value.trim() !== '''') {
        			try {
        				var parsed = JSON.parse(value);
        				return (parsed != null && typeof parsed === ''object'' && !Array.isArray(parsed)) ? parsed : fallback;
        			} catch (e) {
        				this.c8o.log.warn(''[MB] frappeGantt invalid options JSON: '' + e);
        			}
        		}
        		return fallback;
        	}
        
        	public resolveContainerHeight(container: any): number {
        		var resolved = 0;
        		if (container != null) {
        			var rect = container.getBoundingClientRect ? container.getBoundingClientRect() : null;
        			if (rect && rect.height) {
        				resolved = Math.floor(rect.height);
        			}
        			if (!resolved && container.clientHeight) {
        				resolved = Math.floor(container.clientHeight);
        			}
        		}
        		if (!resolved && typeof this.height === ''number'') {
        			resolved = Math.floor(this.height);
        		}
        		if (!resolved && typeof this.height === ''string'') {
        			var match = this.height.match(/^(\d+(?:\.\d+)?)px$/i);
        			if (match != null && match[1]) {
        				resolved = parseInt(match[1], 10);
        			}
        		}
        		return resolved > 0 ? resolved : 0;
        	}
        
        	public renderGantt(): void {
        		try {
        			this.ensureElementId();
        			var container = document.getElementById(this.ganttElementId);
        			if (!container) {
        				return;
        			}
        			container.innerHTML = '''';
        
        			var GanttCtor = window[''Gantt''];
        			if (!GanttCtor) {
        				this.c8o.log.warn(''[MB] frappeGantt script is not loaded yet'');
        				return;
        			}
        
        			var userOptions = this.parseObject(this.options, {});
        			var autoContainerHeight = this.resolveContainerHeight(container);
        			if ((userOptions[''container_height''] == null || userOptions[''container_height''] === '''' || userOptions[''container_height''] === ''auto'') && autoContainerHeight > 0) {
        				userOptions[''container_height''] = autoContainerHeight;
        			}
        
        			var mergedOptions = {
        				view_mode: this.viewMode ? this.viewMode : ''Day'',
        				date_format: this.dateFormat ? this.dateFormat : ''YYYY-MM-DD'',
        				on_click: (task: any) => this.TaskClicked.emit(task),
        				on_date_change: (task: any, start: any, end: any) => this.DateChanged.emit({task: task, start: start, end: end}),
        				on_progress_change: (task: any, progress: any) => this.ProgressChanged.emit({task: task, progress: progress}),
        				on_view_change: (mode: any) => this.ViewChanged.emit(mode)
        			};
        
        			mergedOptions = {
        				...mergedOptions,
        				...userOptions
        			};
        
        			this.ganttInstance = new GanttCtor(''#'' + this.ganttElementId, this.parseArray(this.tasks, []), mergedOptions);
        			if (autoContainerHeight > 0) {
        				var ganttContainer: any = container.querySelector(''.gantt-container'');
        				if (ganttContainer && ganttContainer.style) {
        					ganttContainer.style.height = autoContainerHeight + ''px'';
        				}
        			}
        		} catch (e) {
        			this.c8o.log.warn(''[MB] frappeGantt render failed: '' + e);
        		}
        	}
        	/*End_c8o_CompFunction*/
        '
